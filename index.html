/* ================= helpers ================= */
function nowLocalInput(){
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function toLocalInputValue(iso){
  const d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function fmtDateHeading(iso){
  const d = new Date(iso);
  const days=["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function stageLabel(species, years){
  if(years < 1) return species==="cat" ? "子猫期" : species==="dog" ? "子犬期" : "幼齢期";
  if(years < 7) return species==="cat" ? "成猫期" : species==="dog" ? "成犬期" : "成体期";
  return "シニア期";
}
function ageInfo(birthday, species){
  if(!birthday) return null;
  const b = new Date(birthday), now = new Date();
  const days = Math.floor((now-b)/86400000);
  let years = now.getFullYear()-b.getFullYear(), months = now.getMonth()-b.getMonth();
  if(now.getDate()<b.getDate()) months--;
  if(months<0){ years--; months+=12; }
  return { days, years, months, stage: stageLabel(species, years) };
}
function humanAgeApprox(years, months){
  const t = years + months/12;
  if(t <= 0) return null;
  let h;
  if(t <= 1) h = t*15;
  else if(t <= 2) h = 15 + (t-1)*9;
  else h = 24 + (t-2)*4;
  return Math.max(1, Math.round(h));
}
function esc(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(iso){
  const diff = (new Date() - new Date(iso))/60000;
  if(diff < 1) return "たった今";
  if(diff < 60) return `${Math.floor(diff)}分前`;
  if(diff < 1440) return `${Math.floor(diff/60)}時間前`;
  return `${Math.floor(diff/1440)}日前`;
}
function resizeImageFile(file, maxWidth=640, quality=0.5){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ================= categories ================= */
const CATEGORIES = [
  {key:"food", label:"ごはん", emoji:"🍚", quick:"instant"},
  {key:"water", label:"お水", emoji:"💧", quick:"instant"},
  {key:"pee", label:"おしっこ", emoji:"💧", quick:"binary"},
  {key:"poop", label:"うんち", emoji:"💩", quick:"binary"},
  {key:"health", label:"健康チェック", emoji:"🩺", quick:false},
  {key:"weight", label:"体重", emoji:"⚖️", quick:false},
  {key:"hospital", label:"通院", emoji:"🏥", quick:false},
  {key:"medication", label:"投薬", emoji:"💊", quick:false},
  {key:"trimming", label:"トリミング", emoji:"✂️", quick:false},
];
const CAT_BY_KEY = Object.fromEntries(CATEGORIES.map(c=>[c.key,c]));
const DAILY_CATEGORIES = CATEGORIES.filter(c => ["food","water","pee","poop","health"].includes(c.key));
const HEALTH_CATEGORIES = CATEGORIES.filter(c => ["weight","hospital","medication","trimming"].includes(c.key));

const PREVENTIVE_ITEMS = [
  {key:"vax_rabies", group:"vaccine", label:"狂犬病", emoji:"💉", intervalDays:365},
  {key:"vax_combo", group:"vaccine", label:"混合", emoji:"💉", intervalDays:365},
  {key:"prev_filaria", group:"medicine", label:"フィラリア", emoji:"💗", intervalDays:30},
  {key:"prev_flea", group:"medicine", label:"ノミ", emoji:"🐛", intervalDays:30},
  {key:"prev_tick", group:"medicine", label:"マダニ", emoji:"🕷️", intervalDays:30},
];
const PREV_BY_KEY = Object.fromEntries(PREVENTIVE_ITEMS.map(p=>[p.key,p]));
const ALL_TYPE_META = { ...CAT_BY_KEY, ...PREV_BY_KEY };

function summarizeRecord(r){
  switch(r.type){
    case "food": return [r.amount, r.memo].filter(Boolean).join(" ・ ") || "ごはんを記録";
    case "water": return [r.amount, r.memo].filter(Boolean).join(" ・ ") || "お水を記録";
    case "pee": return [(r.status==="bad"?"気になる様子":"成功"), r.memo].filter(Boolean).join(" ・ ");
    case "poop": return [(r.status==="bad"?"気になる様子":"成功"), r.memo].filter(Boolean).join(" ・ ");
    case "weight": return [`${r.value} kg`, r.memo].filter(Boolean).join(" ・ ");
    case "health": return [r.condition, r.memo].filter(Boolean).join(" ・ ");
    case "hospital": return [r.reason, r.cost?`¥${r.cost}`:"", r.nextVisit?`次回 ${r.nextVisit}`:"", r.memo].filter(Boolean).join(" ・ ");
    case "medication": return [r.name, r.memo].filter(Boolean).join(" ・ ");
    case "trimming": return [r.shop, r.staff, r.nextDate?`次回 ${r.nextDate}`:"", r.memo].filter(Boolean).join(" ・ ");
    default:
      if(PREV_BY_KEY[r.type]) return r.memo || `${PREV_BY_KEY[r.type].label}を記録`;
      return r.memo || "";
  }
}

/* ================= state ================= */
const state = {
  loggedIn: false,
  pet: null,
  tab: "home",
  homeRecords: [], homeUpcoming: [], homeLoading: true,
  healthSectionOpen: true,
  historyRecords: [], historyLastDoc: null, historyHasMore: true, historyLoading: false,
  diary: [], diaryLastDoc: null, diaryHasMore: true, diaryLoading: false,
  weightPoints: null,
  modal: null, modalSub: {}, modalPhoto: null,
};

/* ================= data loading ================= */
async function loadPet(){
  try{
    const doc = await groupRef().get();
    state.pet = doc.exists ? doc.data() : null;
  }catch(e){ console.error("loadPet error", e); state.pet = null; }
}
async function loadHome(){
  state.homeLoading = true; render();
  try{
    const snap = await recordsRef().orderBy("datetime","desc").limit(300).get();
    state.homeRecords = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const upSnap = await upcomingRef().get();
    state.homeUpcoming = upSnap.docs.map(d=>({type:d.id, ...d.data()}));
  }catch(e){ console.error("loadHome error", e); }
  state.homeLoading = false; render();
}
async function loadHistory(){
  state.historyLoading = true; render();
  try{
    const snap = await recordsRef().orderBy("datetime","desc").limit(30).get();
    state.historyRecords = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.historyLastDoc = snap.docs[snap.docs.length-1] || null;
    state.historyHasMore = snap.docs.length === 30;
  }catch(e){ console.error("loadHistory error", e); }
  state.historyLoading = false; render();
}
async function loadMoreHistory(){
  if(!state.historyLastDoc) return;
  state.historyLoading = true; render();
  const snap = await recordsRef().orderBy("datetime","desc").startAfter(state.historyLastDoc).limit(30).get();
  state.historyRecords = state.historyRecords.concat(snap.docs.map(d=>({id:d.id, ...d.data()})));
  state.historyLastDoc = snap.docs[snap.docs.length-1] || null;
  state.historyHasMore = snap.docs.length === 30;
  state.historyLoading = false; render();
}
async function loadWeight(){
  state.weightPoints = null; render();
  try{
    const snap = await recordsRef().where("type","==","weight").get();
    const pts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    pts.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
    state.weightPoints = pts;
  }catch(e){
    console.error("loadWeight error", e);
    state.weightPoints = [];
  }
  render();
  setTimeout(drawWeightChart, 30);
}
async function loadDiary(){
  state.diaryLoading = true; render();
  try{
    const snap = await diaryRef().orderBy("date","desc").limit(18).get();
    state.diary = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.diaryLastDoc = snap.docs[snap.docs.length-1] || null;
    state.diaryHasMore = snap.docs.length === 18;
  }catch(e){ console.error("loadDiary error", e); }
  state.diaryLoading = false; render();
}
async function loadMoreDiary(){
  if(!state.diaryLastDoc) return;
  state.diaryLoading = true; render();
  const snap = await diaryRef().orderBy("date","desc").startAfter(state.diaryLastDoc).limit(18).get();
  state.diary = state.diary.concat(snap.docs.map(d=>({id:d.id, ...d.data()})));
  state.diaryLastDoc = snap.docs[snap.docs.length-1] || null;
  state.diaryHasMore = snap.docs.length === 18;
  state.diaryLoading = false; render();
}

/* ================= pet photo picker (shared by setup & settings) ================= */
function renderPetPhotoBox(photo){
  return `
  <input type="file" accept="image/*" id="pet-photo-file" style="display:none" onchange="handlePetPhoto(this)">
  <div id="pet-photo-box" class="photo-picker" onclick="document.getElementById('pet-photo-file').click()">

  </div>`;
}
async function handlePetPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const box = document.getElementById("pet-photo-box");
  box.innerHTML = `<span class="mono spin" style="font-size:11px;">…</span>`;
  try{
    const dataUrl = await resizeImageFile(file, 480, 0.62);
    state.tmpPetPhoto = dataUrl;
    box.innerHTML = `<img src="${dataUrl}">`;
  }catch(e){
    box.innerHTML = `<span style="font-size:10px;color:var(--inkSoft);">失敗</span>`;
  }
}

/* ================= pet setup (first run only) ================= */
async function submitPetSetup(){
  const name = document.getElementById("pet-name").value.trim();
  if(!name){ document.getElementById("pet-err").textContent = "名前を入力してください"; return; }
  const species = state.tmpSpecies || "dog";
  const gender = state.tmpGender || "unknown";
  const breed = document.getElementById("pet-breed").value.trim();
  const birthday = document.getElementById("pet-birthday").value;
  const photo = state.tmpPetPhoto || null;
  const pet = { name, species, gender, breed, birthday, photo, createdAt: new Date().toISOString() };
  await groupRef().set(pet, { merge: true });
  state.pet = pet;
  state.tab = "home";
  render();
  loadHome();
}

/* ================= quick logging (instant, no modal) ================= */
async function quickLog(catKey, extra){
  const rec = { type:catKey, datetime:new Date().toISOString(), memo:"", author:getMyName(), createdAt:new Date().toISOString(), ...extra };
  await recordsRef().add(rec);
  if(state.tab === "home") loadHome();
  if(state.tab === "history") loadHistory();
}

/* ================= modal (detail form) ================= */
function openRecordModal(catKey, editRecord){
  state.modal = { type:"record", catKey, editRecord: editRecord || null };
  state.modalSub = {
    amount: (editRecord && editRecord.amount) || "ふつう",
    status: (editRecord && editRecord.status !== undefined) ? editRecord.status : "",
    condition: (editRecord && editRecord.condition) || "元気",
  };
  render();
}
function openDiaryModal(editEntry){
  state.modal = { type:"diary", editEntry: editEntry || null };
  state.modalPhoto = editEntry ? (editEntry.photo || null) : null;
  state.modalSub = { mood: (editEntry && editEntry.mood) || "元気" };
  render();
}
function closeModal(){ state.modal = null; render(); }
function setModalSub(field, value){ state.modalSub[field] = value; render(); }

function findRecordById(id){
  return state.historyRecords.find(r=>r.id===id) || state.homeRecords.find(r=>r.id===id) || null;
}
function openEditRecordById(id){
  const r = findRecordById(id);
  if(r) openRecordModal(r.type, r);
}

async function saveRecordFromModal(){
  const catKey = state.modal.catKey;
  const editRecord = state.modal.editRecord;
  const dtVal = document.getElementById("rf-datetime").value;
  const memo = document.getElementById("rf-memo") ? document.getElementById("rf-memo").value.trim() : "";
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  let rec = {
    type: catKey,
    datetime: new Date(dtVal).toISOString(),
    memo,
    author: editRecord ? (editRecord.author || getMyName()) : getMyName(),
    createdAt: editRecord ? editRecord.createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };

  if(CAT_BY_KEY[catKey]){
    if(catKey === "food" || catKey === "water"){ rec.amount = state.modalSub.amount; }
    if(catKey === "pee" || catKey === "poop"){ rec.status = state.modalSub.status; }
    if(catKey === "weight"){
      const v = parseFloat(val("rf-weight"));
      if(isNaN(v)){ document.getElementById("rf-err").textContent = "体重を入力してください"; return; }
      rec.value = v;
    }
    if(catKey === "health"){ rec.condition = state.modalSub.condition; }
    if(catKey === "hospital"){ rec.reason = val("rf-reason"); rec.cost = val("rf-cost") ? Number(val("rf-cost")) : null; rec.nextVisit = val("rf-nextvisit"); }
    if(catKey === "medication"){ rec.name = val("rf-medname"); }
    if(catKey === "trimming"){ rec.shop = val("rf-shop"); rec.staff = val("rf-staff"); rec.nextDate = val("rf-nextdate"); }
  }

  const btn = document.getElementById("rf-submit");
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    if(editRecord){
      await recordsRef().doc(editRecord.id).update(rec);
    } else {
      await recordsRef().add(rec);
    }
    if(catKey === "hospital" && rec.nextVisit){ await upcomingRef().doc("hospital").set({ label:"通院", date: rec.nextVisit, memo: rec.memo }); }
    if(catKey === "trimming" && rec.nextDate){ await upcomingRef().doc("trimming").set({ label:"トリミング", date: rec.nextDate, memo: rec.memo }); }
    if(PREV_BY_KEY[catKey]){
      const item = PREV_BY_KEY[catKey];
      const next = new Date(rec.datetime);
      next.setDate(next.getDate() + item.intervalDays);
      await upcomingRef().doc(catKey).set({
        label: `${item.label}${item.group==='vaccine'?'接種':'投与'}`,
        date: next.toISOString().slice(0,10),

let weightChartInstance = null;

  const labels = state.weightPoints.map(p => new Date(p.datetime).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"}));
  const data = state.weightPoints.map(p => p.value);
  if(weightChartInstance) weightChartInstance.destroy();
  weightChartInstance = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: { labels, datasets: [{ data, borderColor: "#C1443A", backgroundColor: "#C1443A", tension: 0.3, pointRadius: 3 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: { family: "IBM Plex Mono", size: 11 }, color: "#8B7A6E" }, grid: { display: false } },

/* ================= WEIGHT ================= */
function renderWeight(){
  const log = state.weightPoints;
  const latest = log && log.length ? log[log.length-1] : null;
  const prev = log && log.length>1 ? log[log.length-2] : null;
  let monthAgo = null;
  if(log && log.length>1 && latest){
    const target = new Date(latest.datetime); target.setDate(target.getDate()-30);
    const candidates = log.filter(p => new Date(p.datetime) <= target);
    monthAgo = candidates.length ? candidates[candidates.length-1] : null;
  }
  const minVal = log && log.length ? Math.min(...log.map(p=>p.value)) : null;
  const maxVal = log && log.length ? Math.max(...log.map(p=>p.value)) : null;

  function diffBlock(label, from, isFirst){
    if(!from || !latest || from === latest) return "";
    const d = latest.value - from.value;
    const flat = Math.abs(d) < 0.005;
    const pct = from.value ? (d/from.value*100) : 0;
    const up = d > 0;
    const color = flat ? "var(--inkSoft)" : (up ? "var(--coral)" : "var(--mintText)");
    const arrow = flat ? "→" : (up ? "↑" : "↓");
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${isFirst?'':'border-top:1px solid var(--line);'}">
      <span style="font-size:13px;color:var(--inkSoft);">${label}と比較</span>
      <span class="mono" style="font-size:14px;font-weight:600;color:${color};">${arrow} ${flat?'変化なし':`${Math.abs(d).toFixed(2)} kg（${Math.abs(pct).toFixed(1)}%）`}</span>
    </div>`;
  }

  return `
  <div class="card" style="padding:16px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:12px;color:var(--inkSoft);">最新の体重</div>
        <div class="mono" style="font-size:30px;font-weight:600;">${latest?`${latest.value} kg`:(log===null?"…":"—")}</div>
      </div>
      <button class="row-btn" onclick="openRecordModal('weight')">＋ 記録</button>
    </div>
    ${prev ? diffBlock("前回", prev, true) : ""}
    ${monthAgo ? diffBlock("1ヶ月前", monthAgo, !prev) : ""}
  </div>

  ${minVal!==null ? `
  <div class="card" style="padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;">
    <div><div class="mono" style="font-size:17px;">${minVal} kg</div><div style="font-size:11px;color:var(--inkSoft);">最小</div></div>
    <div><div class="mono" style="font-size:17px;">${maxVal} kg</div><div style="font-size:11px;color:var(--inkSoft);">最大</div></div>
    <div><div class="mono" style="font-size:17px;">${log.length}</div><div style="font-size:11px;color:var(--inkSoft);">記録数</div></div>
  </div>` : ""}

  <div class="card" style="padding:16px 8px 8px;">
    ${log===null ? `<div style="text-align:center;padding:30px;"><span class="spin">⏳</span></div>` :
      log.length<2 ? `<div style="text-align:center;padding:24px 12px;color:var(--inkSoft);font-size:13px;">体重の記録が2件以上になるとグラフが表示されます。</div>` :
      `<canvas id="weight-canvas" height="220"></canvas>`
    }
  </div>`;
}

    <label class="field"><div class="field-label">表示名（記録に表示されます・任意）</div><input id="set-myname" value="${esc(getMyName())}" placeholder="例：太郎"></label>
    <button class="btn-primary" onclick="saveMyNameSetting()">保存</button>
  </div>

  <div class="mono" style="font-size:11px;letter-spacing:1px;color:var(--inkSoft);margin:4px 0 8px;">セキュリティ</div>
  <div class="card" style="padding:16px;margin-bottom:18px;">
    <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:12px;line-height:1.6;">
      このアプリはパスワードでログイン中です。同じ端末・ブラウザなら次回以降も自動でログインしたままになります。
    </div>
    <button class="btn-danger" onclick="logout()">ログアウト</button>
  </div>

  <div class="mono" style="font-size:11px;letter-spacing:1px;color:var(--inkSoft);margin:4px 0 8px;">ペットの情報</div>
  <div class="card" style="padding:16px;margin-bottom:18px;">
    <div style="margin-bottom:14px;">${renderPetPhotoBox(state.tmpPetPhoto)}</div>
    <label class="field"><div class="field-label">名前</div><input id="set-pet-name" value="${esc(pet.name)}"></label>
    <div class="field">
      <div class="field-label">種類</div>
      <div class="chip-row">
        <button class="chip ${state.tmpSpecies==='dog'?'active':''}" onclick="state.tmpSpecies='dog';render()">🐶 犬</button>
        <button class="chip ${state.tmpSpecies==='cat'?'active':''}" onclick="state.tmpSpecies='cat';render()">🐱 猫</button>
        <button class="chip ${state.tmpSpecies==='other'?'active':''}" onclick="state.tmpSpecies='other';render()">🐾 その他</button>
      </div>
    </div>
    <div class="field">
      <div class="field-label">性別</div>
      <div class="chip-row">
        <button class="chip ${state.tmpGender==='male'?'active':''}" onclick="state.tmpGender='male';render()">♂ 男の子</button>
        <button class="chip ${state.tmpGender==='female'?'active':''}" onclick="state.tmpGender='female';render()">♀ 女の子</button>
        <button class="chip ${state.tmpGender==='unknown'?'active':''}" onclick="state.tmpGender='unknown';render()">不明</button>
      </div>
    </div>
    <label class="field"><div class="field-label">犬種・猫種</div><input id="set-pet-breed" value="${esc(pet.breed||"")}"></label>
    <label class="field"><div class="field-label">お誕生日</div><input id="set-pet-birthday" type="date" value="${esc(pet.birthday||"")}"></label>
    <button class="btn-primary" onclick="savePetSettings()">保存</button>
  </div>

  <div style="font-size:11.5px;color:var(--inkSoft);text-align:center;line-height:1.7;">
    記録は自動的に消えません。ふたりでずっと残していけます。<br>
    ※人間換算年齢・年齢の表示は簡易的な目安です。
  </div>`;
}

/* ================= modals ================= */
function renderModal(){
  if(!state.modal) return "";
  if(state.modal.type === "record") return renderRecordModal();
  if(state.modal.type === "diary") return renderDiaryModal();
  return "";
}
function chipField(label, options, current, subKey){
  return `<div class="field"><div class="field-label">${label}</div><div class="chip-row">
    ${options.map(o=>`<button class="chip ${current===o?'active':''}" onclick="setModalSub('${subKey}','${o}')">${o}</button>`).join("")}
  </div></div>`;
}
function renderRecordModal(){
  const catKey = state.modal.catKey;
  const editRecord = state.modal.editRecord;
  const cat = CAT_BY_KEY[catKey] || PREV_BY_KEY[catKey];
  const sub = state.modalSub;
  let fields = "";
  if(catKey === "food"){ fields = chipField("量", ["少なめ","ふつう","多め","残した"], sub.amount, "amount"); }
  else if(catKey === "water"){ fields = chipField("量の目安", ["少なめ","ふつう","多め"], sub.amount, "amount"); }
  else if(catKey === "pee" || catKey === "poop"){
    fields = `<div class="field"><div class="field-label">様子</div><div class="chip-row">
      <button class="chip ${sub.status===''?'active':''}" onclick="setModalSub('status','')">特になし</button>
      <button class="chip ${sub.status==='good'?'active':''}" onclick="setModalSub('status','good')">順調</button>
      <button class="chip ${sub.status==='bad'?'active':''}" onclick="setModalSub('status','bad')">気になる</button>
    </div></div>`;
  } else if(catKey === "weight"){
    fields = `<label class="field"><div class="field-label">体重（kg）</div><input id="rf-weight" type="number" step="0.01" placeholder="例：4.20" value="${editRecord?editRecord.value:''}"></label>`;
  } else if(catKey === "health"){
    fields = chipField("今日の様子", ["元気","普通","不調"], sub.condition, "condition");
  } else if(catKey === "hospital"){
    fields = `
      <label class="field"><div class="field-label">内容・理由</div><input id="rf-reason" placeholder="例：定期健診" value="${esc(editRecord?editRecord.reason:'')}"></label>
      <label class="field"><div class="field-label">費用（円・任意）</div><input id="rf-cost" type="number" value="${editRecord&&editRecord.cost?editRecord.cost:''}"></label>
      <label class="field"><div class="field-label">次回の予定（任意）</div><input id="rf-nextvisit" type="date" value="${esc(editRecord?editRecord.nextVisit||'':'')}"></label>`;
  } else if(catKey === "medication"){
    fields = `<label class="field"><div class="field-label">薬の名前</div><input id="rf-medname" placeholder="例：フィラリア予防薬" value="${esc(editRecord?editRecord.name:'')}"></label>`;
  } else if(catKey === "trimming"){
    fields = `
      <label class="field"><div class="field-label">お店（任意）</div><input id="rf-shop" value="${esc(editRecord?editRecord.shop||'':'')}"></label>
      <label class="field"><div class="field-label">担当者（任意）</div><input id="rf-staff" value="${esc(editRecord?editRecord.staff||'':'')}"></label>
      <label class="field"><div class="field-label">次回の予定（任意）</div><input id="rf-nextdate" type="date" value="${esc(editRecord?editRecord.nextDate||'':'')}"></label>`;
  }
  const dtValue = editRecord ? toLocalInputValue(editRecord.datetime) : nowLocalInput();
  const memoValue = editRecord ? esc(editRecord.memo||"") : "";
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="display" style="font-weight:700;font-size:19px;">${cat.label}を${editRecord?'編集':'記録'}</div>
        <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:18px;">✕</button>
      </div>
      <label class="field"><div class="field-label">日時</div><input id="rf-datetime" type="datetime-local" value="${dtValue}"></label>
      ${fields}
      <label class="field"><div class="field-label">メモ（任意）</div><textarea id="rf-memo" rows="2">${memoValue}</textarea></label>
      ${catKey==="health" ? `<div style="font-size:11.5px;color:var(--inkSoft);margin-bottom:10px;line-height:1.6;">※ここでの記録は診断ではありません。気になる様子があるときは動物病院にご相談ください。</div>` : ""}
      <div id="rf-err" style="color:var(--coral);font-size:12.5px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;">
        <button id="rf-submit" class="btn-primary" style="flex:1;" onclick="saveRecordFromModal()">${editRecord?'保存する':'記録する'}</button>
        ${editRecord ? `<button class="btn-danger" onclick="deleteRecordFromModal()">削除</button>` : ""}
      </div>
    </div>
  </div>`;
}
function renderDiaryModal(){
  const e = state.modal.editEntry;
  const dateVal = e ? e.date.slice(0,10) : nowLocalInput().slice(0,10);
  const captionVal = e ? esc(e.caption||"") : "";
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="display" style="font-weight:700;font-size:19px;">${e?'日記を編集':'今日の一枚'}</div>
        <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:18px;">✕</button>
      </div>
      <label class="field"><div class="field-label">日付</div><input id="df-date" type="date" value="${dateVal}"></label>
      <div class="field">
        <div class="field-label">写真（任意）</div>
        <input type="file" accept="image/*" id="df-file" style="display:none" onchange="handleDiaryPhoto(this)">
        <div id="df-photobox" onclick="document.getElementById('df-file').click()" style="display:flex;align-items:center;justify-content:center;min-height:110px;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);cursor:pointer;overflow:hidden;">
          ${state.modalPhoto ? `<img src="${state.modalPhoto}" style="width:100%;border-radius:10px;display:block;">` : `<span class="mono" style="font-size:13px;color:var(--inkSoft);">📷 写真を選ぶ</span>`}
        </div>
      </div>
      ${chipField("今日の様子", ["元気","普通","不調"], state.modalSub.mood||"元気", "mood")}
      <label class="field"><div class="field-label">一言（任意）</div><textarea id="df-caption" rows="2" placeholder="今日はお散歩でリスを追いかけました">${captionVal}</textarea></label>
      <div id="df-err" style="color:var(--coral);font-size:12.5px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;">
        <button id="df-submit" class="btn-primary" style="flex:1;" onclick="saveDiaryFromModal()">${e?'保存する':'残す'}</button>
        ${e ? `<button class="btn-danger" onclick="deleteDiaryFromModal()">削除</button>` : ""}
      </div>
    </div>
  </div>`;
}

/* ================= pet setup screen (first run only) ================= */
function renderPetSetup(){
  if(state.tmpSpecies === undefined) state.tmpSpecies = "dog";
  if(state.tmpGender === undefined) state.tmpGender = "unknown";
  if(state.tmpPetPhoto === undefined) state.tmpPetPhoto = null;
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
      <span style="font-size:24px;">🐾</span>
    </div>
    <div class="display" style="font-weight:700;font-size:20px;margin-bottom:4px;">この子のことを教えて</div>
    <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:22px;">あとから設定からいつでも変更できます</div>
    <div class="card" style="width:100%;max-width:400px;padding:22px;">
      <div style="margin-bottom:16px;">${renderPetPhotoBox(state.tmpPetPhoto)}</div>
      <label class="field"><div class="field-label">名前</div><input id="pet-name" placeholder="例：もふ"></label>
      <div class="field">
        <div class="field-label">種類</div>
        <div class="chip-row">
          <button class="chip ${state.tmpSpecies==='dog'?'active':''}" onclick="state.tmpSpecies='dog';render()">🐶 犬</button>
          <button class="chip ${state.tmpSpecies==='cat'?'active':''}" onclick="state.tmpSpecies='cat';render()">🐱 猫</button>
          <button class="chip ${state.tmpSpecies==='other'?'active':''}" onclick="state.tmpSpecies='other';render()">🐾 その他</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">性別</div>
        <div class="chip-row">
          <button class="chip ${state.tmpGender==='male'?'active':''}" onclick="state.tmpGender='male';render()">♂ 男の子</button>
          <button class="chip ${state.tmpGender==='female'?'active':''}" onclick="state.tmpGender='female';render()">♀ 女の子</button>
          <button class="chip ${state.tmpGender==='unknown'?'active':''}" onclick="state.tmpGender='unknown';render()">不明</button>
        </div>
      </div>
      <label class="field"><div class="field-label">犬種・猫種（任意）</div><input id="pet-breed" placeholder="例：トイプードル"></label>
      <label class="field"><div class="field-label">お誕生日（任意）</div><input id="pet-birthday" type="date"></label>
      <div id="pet-err" style="color:var(--coral);font-size:13px;margin-bottom:10px;"></div>
      <button class="btn-primary" style="width:100%;margin-top:4px;" onclick="submitPetSetup()">はじめる</button>
    </div>
  </div>`;
}

/* ================= login screen ================= */
function renderLogin(){
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
    <div style="font-size:40px;margin-bottom:10px;">🐾</div>
    <div class="display" style="font-weight:700;font-size:22px;margin-bottom:24px;">おかえりなさい</div>
    <div class="card" style="width:100%;max-width:360px;padding:22px;">
      <label class="field">
        <div class="field-label">パスワード</div>
        <input id="login-pw" type="password" onkeydown="if(event.key==='Enter') loginSubmit()" placeholder="••••••••">
      </label>
      <div id="login-err" style="color:var(--coral);font-size:13px;margin-bottom:10px;"></div>
      <button id="login-btn" class="btn-primary" style="width:100%;" onclick="loginSubmit()">ログイン</button>
    </div>
  </div>`;
}

/* ================= master render ================= */
const TABS = [
  {key:"home", label:"ホーム", emoji:"🏠"},
  {key:"history", label:"きろく", emoji:"📖"},
  {key:"weight", label:"体重", emoji:"⚖️"},
  {key:"diary", label:"日記", emoji:"📷"},
  {key:"settings", label:"設定", emoji:"⚙️"},
];

function render(){
  const app = document.getElementById("app");
  if(!authReady){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span class="spin" style="font-size:24px;">⏳</span></div>`;
    return;
  }
  if(!state.loggedIn){
    app.innerHTML = renderLogin();
    return;
  }
  if(!state.pet){
    app.innerHTML = renderPetSetup();
    return;
  }

  let body = "";
  if(state.tab === "home") body = renderHome();
  else if(state.tab === "history") body = renderHistory();
  else if(state.tab === "weight") body = renderWeight();
  else if(state.tab === "diary") body = renderDiary();
  else if(state.tab === "settings") body = renderSettings();

  app.innerHTML = `
    ${renderTopBar()}
    <div style="padding:6px 14px 90px;">${body}</div>
    <div class="tabbar">
      ${TABS.map(t=>`
        <button class="tabbtn ${state.tab===t.key?'active':''}" onclick="switchTab('${t.key}')">
          <span style="font-size:19px;">${t.emoji}</span>
          <span style="font-size:10.5px;">${t.label}</span>
        </button>`).join("")}
    </div>
    ${renderModal()}
  `;
  if(state.tab === "weight") setTimeout(drawWeightChart, 30);
}

render();
</script>
</body>
</html>
