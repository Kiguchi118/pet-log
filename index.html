<script>
/* ================= Firebase init ================= */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let authReady = false;
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

auth.onAuthStateChanged(async (u) => {
  const wasLoggedIn = state.loggedIn;
  authReady = true;
  state.loggedIn = !!u;
  render();
  if(u && !wasLoggedIn){
    await loadPet();
    render();
    if(state.pet) loadHome();
  }
});

async function loginSubmit(){
  const pwInput = document.getElementById("login-pw");
  const pw = pwInput ? pwInput.value : "";
  const btn = document.getElementById("login-btn");
  const err = document.getElementById("login-err");
  if(err) err.textContent = "";
  if(!pw){ if(err) err.textContent = "パスワードを入力してください"; return; }
  btn.disabled = true; btn.textContent = "確認中…";
  try{
    await auth.signInWithEmailAndPassword(LOGIN_EMAIL, pw);
  }catch(e){
    if(err) err.textContent = "パスワードが違います";
    btn.disabled = false; btn.textContent = "ログイン";
  }
}
async function logout(){
  if(!confirm("ログアウトしますか？次回からまたパスワードの入力が必要になります。")) return;
  await auth.signOut();
  state.pet = null;
}

/* ================= local (per-device) name ================= */
function getMyName(){ return localStorage.getItem("bukuroku_myname") || ""; }

function getHiddenCategories(){
  try{ return JSON.parse(localStorage.getItem("bukuroku_hidden_cats") || "[]"); }catch(e){ return []; }

/* ================= toast (with optional undo action) ================= */
function showToast(message, undoFn){
  state.toast = { message, undo: undoFn || null };
  render();
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ state.toast = null; render(); }, undoFn ? 4500 : 2200);
}
async function runToastUndo(){
  const t = state.toast;
  if(!t || !t.undo) return;
  clearTimeout(window._toastTimer);
  state.toast = null; render();
  try{
    await t.undo();
  }catch(e){ console.error("undo error", e); }
}

/* ================= helpers ================= */
function nowLocalInput(){
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function toLocalInputValue(iso){
  const d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function fmtDateHeading(iso){
  const d = new Date(iso);
  const days=["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
}
function fmtDateShort(iso){
  const d = new Date(iso);
  const days=["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function stageLabel(species, years){
  if(years < 1) return species==="cat" ? "子猫期" : species==="dog" ? "子犬期" : "幼齢期";
  if(years < 7) return species==="cat" ? "成猫期" : species==="dog" ? "成犬期" : "成体期";
  return "シニア期";
}
function ageInfo(birthday, species){
  if(!birthday) return null;
  const b = new Date(birthday), now = new Date();
  const days = Math.floor((now-b)/86400000);
  let years = now.getFullYear()-b.getFullYear(), months = now.getMonth()-b.getMonth();
  if(now.getDate()<b.getDate()) months--;
  if(months<0){ years--; months+=12; }
  return { days, years, months, stage: stageLabel(species, years) };
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00"), now = new Date(); now.setHours(0,0,0,0);
  const days = Math.floor((now-d)/86400000);
  return days >= 0 ? days : null;
}
function isValidMicrochip(v){
  return !v || /^\d{15}$/.test(v);
}
function humanAgeApprox(years, months){
  const t = years + months/12;
  if(t <= 0) return null;
  let h;
  if(t <= 1) h = t*15;
  else if(t <= 2) h = 15 + (t-1)*9;
  else h = 24 + (t-2)*4;
  return Math.max(1, Math.round(h));
}
function localDayStr(input){
  const d = (input instanceof Date) ? input : new Date(input);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function maskEmail(email){
  const m = /^(.{1,3})(.*)(@.+)$/.exec(email||"");
  if(!m) return email||"";
  return `${m[1]}${"•".repeat(Math.max(3, m[2].length))}${m[3]}`;
}
function esc(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(iso){
  const diff = (new Date() - new Date(iso))/60000;
  if(diff < 1) return "たった今";
  if(diff < 60) return `${Math.floor(diff)}分前`;
  if(diff < 1440) return `${Math.floor(diff/60)}時間前`;
  return `${Math.floor(diff/1440)}日前`;
}
function resizeImageFile(file, maxWidth=480, quality=0.4){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function summarizeRecord(r){
  switch(r.type){
    case "food": return [r.amount, r.memo].filter(Boolean).join(" ・ ") || "ごはんを記録";
    case "water": return [r.amount, r.memo].filter(Boolean).join(" ・ ") || "お水を記録";
    case "pee": return [(r.status==="bad"?"失敗":"成功"), r.urineColor, r.urineAmount, r.memo].filter(Boolean).join(" ・ ");
    case "poop": return [(r.status==="bad"?"失敗":"成功"), r.stoolScore?`便スコア${r.stoolScore}`:"", r.stoolAmount, r.stoolColor, r.memo].filter(Boolean).join(" ・ ");
    case "vomit": return [r.vomitContent, r.count?`${r.count}回`:"", r.memo].filter(Boolean).join(" ・ ") || "吐いたことを記録";
    case "walk": return [r.duration?`${r.duration}分`:"", r.distance?`${r.distance}km`:"", r.condition, r.memo].filter(Boolean).join(" ・ ") || "散歩を記録";
    case "weight": return [`${r.value} kg`, r.memo].filter(Boolean).join(" ・ ");
    case "health": return [r.condition, r.memo].filter(Boolean).join(" ・ ");
    case "hospital": return [r.reason, r.cost?`¥${r.cost}`:"", r.nextVisit?`次回 ${r.nextVisit}`:"", r.memo].filter(Boolean).join(" ・ ");
    case "medication": return [r.name, r.memo].filter(Boolean).join(" ・ ");
    case "trimming": return [r.shop, r.staff, r.nextDate?`次回 ${r.nextDate}`:"", r.memo].filter(Boolean).join(" ・ ");
    default:
      if(PREV_BY_KEY[r.type]){
        if(PREV_BY_KEY[r.type].group === "vaccine"){
          return [r.hospital, r.nextDue?`次回 ${r.nextDue}`:"", r.memo].filter(Boolean).join(" ・ ") || `${PREV_BY_KEY[r.type].label}接種を記録`;
        }
        return r.memo || `${PREV_BY_KEY[r.type].label}を記録`;
      }
      return r.memo || "";
  }
}

async function loadStatsForPeriod(days){
  state.statsPeriod = days;
  state.stats = null; render();
  try{
    const startISO = new Date(Date.now() - days*86400000).toISOString();
    const snap = await recordsRef().where("datetime", ">=", startISO).get();
    const recs = snap.docs.map(d=>d.data());
    const pee = recs.filter(r=>r.type==="pee");
    const poop = recs.filter(r=>r.type==="poop");
    const goodCount = arr => arr.filter(r=>r.status!=="bad").length;
    const rate = arr => arr.length ? Math.round(100*goodCount(arr)/arr.length) : null;
    state.stats = {
      peeRate: rate(pee), poopRate: rate(poop),
      peeCount: pee.length, poopCount: poop.length,
      peeGood: goodCount(pee), poopGood: goodCount(poop),
    };
  }catch(e){
    console.error("loadStats error", e);
    state.stats = { peeRate:null, poopRate:null, peeCount:0, poopCount:0, peeGood:0, poopGood:0 };
  }
  render();
}

/* ================= おさんぽ天気（Open-Meteo） ================= */
/* ---- お散歩判定：気温だけでなく複数の要素を組み合わせて判定 ----
   参考にした知見（獣医・動物保護団体等の公開情報より）：
   ・暑さ側は、湿度や風を含む「体感温度」（apparent_temperature）で判定する。湿度が高いと
     犬はパンティングで熱を逃がしにくくなるため（米国の獣医師の目安「気温[℉]＋湿度[%]≧150で運動を避ける」も
     気温と湿度をあわせて見よ、という考え方）
   ・寒さ側は、風の影響を受けやすい体感温度ではなく「実際の気温」で判定する。風が強いだけの
     体感温度低下で必要以上に「さけて」判定にならないようにするため
   ・推定路面温度。晴天で直射日光が当たると、アスファルトは気温より最大25〜30℃前後も高くなり
     （気温25℃前後→路面約51℃、気温30℃前後→路面約57℃など、獣医・ペット関連団体の実測データより）、
     50℃を超えるあたりから60秒未満で肉球が低温やけどを負う恐れがあるとされる。ただしこの上昇幅は
     気温が高い夏場のデータが中心のため、気温が低いうちは上昇幅も小さくなるよう段階的に見積もる
   ・天気そのもの。雷雨や強い雨・雪は、気温に関わらず外出を避けたい天気として扱う
*/
const WALK_APPARENT_THRESHOLDS = {
  goodMin: 7,       // 🟢 おすすめ：goodMin ≦ 気温 ＜ warnHighMin
  warnHighMin: 24,  // 🟡 ようすを見て（暑い側）：warnHighMin ≦ 体感 ＜ dangerHighMin
  dangerHighMin: 29,// 🔴 さけて（暑い側）：体感 ≧ dangerHighMin
  warnLowMin: 0,    // 🟡 ようすを見て（寒い側）：warnLowMin ≦ 気温 ＜ goodMin
  // 🔴 さけて（寒い側）：気温 ＜ warnLowMin
};
const PAVEMENT_DANGER_C = 52; // ℃。60秒未満で肉球がやけどするリスクが高まるとされる目安
const PAVEMENT_WARN_C = 45;   // ℃。素手で7秒触れ続けられないくらい熱く、要注意になる目安
const HEAVY_WEATHER_CODES = [65,75,82,86,95,96,99]; // 強い雨・強い雪・雷雨など、気温に関わらず避けたい天気
const MODERATE_WEATHER_CODES = [51,53,55,56,57,61,63,66,67,71,73,77,80,81,85]; // 弱い雨・雪など、ようすを見たい天気

/* 気温・天気・昼夜から、路面（アスファルト等）のおおよその温度を推定する。
   気温が低いうちは上昇幅を小さく、気温25℃以上で実測データに近い上昇幅になるよう段階的に増やす */
function scaledExcess(temp, minT, maxT, minE, maxE){
  if(temp == null) return minE;
  const frac = Math.max(0, Math.min(1, (temp - minT) / (maxT - minT)));
  return minE + frac * (maxE - minE);
}
function pavementExcess(temp, code, isDay){
  if(!isDay) return 3; // 夜間は日射による蓄熱がほぼ抜けるため、上乗せはわずか
  const cat = weatherCategory(code);
  if(cat === "sunny")  return scaledExcess(temp, 12, 25, 8, 27);  // 気温12℃で+8℃、25℃以上で+27℃程度
  if(cat === "cloudy") return scaledExcess(temp, 12, 25, 4, 13);  // 曇り・薄曇りは上昇幅を控えめに
  return 3;                                                       // 雨・雪など：路面が濡れて冷えやすく上昇はわずか
}
/* Open-Meteoの地表(0cm)温度データは、直射日光下の裸地モデルのため気温が高くなくても
   跳ね上がることがあり、説明しにくく予測しづらい数値になる。そのため使わず、
   気温・天気・昼夜から算出する推定式だけを採用する（実測データに基づくため一貫性がある） */
function estimatePavementTemp(airTemp, code, isDay){
  if(airTemp == null) return null;
  return airTemp + pavementExcess(airTemp, code, isDay);
}
/* h = { temp, apparent, code, isDay } を受け取り、おすすめ／ようすを見て／さけて を返す */
function judgeWalk(h){
  if(!h) return "warn";
  const { temp, apparent, code, isDay } = h;
  if(temp == null || isNaN(temp)) return "warn";
  const heatFeels = (apparent!=null && !isNaN(apparent)) ? apparent : temp;

  if(HEAVY_WEATHER_CODES.includes(code)) return "bad";

  // 寒さ側は実際の気温で判定（風による体感低下だけで過剰に「さけて」にならないようにする）
  if(temp < WALK_APPARENT_THRESHOLDS.warnLowMin) return "bad";

  const pavement = estimatePavementTemp(temp, code, isDay);
  if(pavement != null && pavement >= PAVEMENT_DANGER_C) return "bad";
  if(heatFeels >= WALK_APPARENT_THRESHOLDS.dangerHighMin) return "bad";

  if(MODERATE_WEATHER_CODES.includes(code)) return "warn";
  if(pavement != null && pavement >= PAVEMENT_WARN_C) return "warn";
  if(heatFeels >= WALK_APPARENT_THRESHOLDS.warnHighMin) return "warn";
  if(temp < WALK_APPARENT_THRESHOLDS.goodMin) return "warn";
  return "good";
}
const JUDGE_META = {
  good: { label: "おすすめ", cls: "good" },
  warn: { label: "ようすを見て", cls: "warn" },

  56:{label:"着氷性の霧雨",emoji:"🌧️"}, 57:{label:"着氷性の霧雨",emoji:"🌧️"},
  61:{label:"雨",emoji:"🌧️"}, 63:{label:"雨",emoji:"🌧️"}, 65:{label:"強い雨",emoji:"🌧️"},

  80:{label:"にわか雨",emoji:"🌦️"}, 81:{label:"にわか雨",emoji:"🌦️"}, 82:{label:"激しいにわか雨",emoji:"🌦️"},

};
function weatherCodeMeta(code){ return WMO_CODE_META[code] || { label:"—", emoji:"🌡️" }; }
/* 天気コードを「晴れ・くもり・霧・雨・雪・雷雨」の大分類に振り分け、それぞれに分かりやすい背景色をあてる */
function weatherCategory(code){
  if(code===0 || code===1) return "sunny";
  if(code===2 || code===3 || code===45 || code===48) return "cloudy";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return "rain";
  if([71,73,75,77,85,86].includes(code)) return "snow";
  return "sunny";
}
/* 週間ストリップ用の色。晴れ＝赤（やや濃いめ）、雨（雷雨含む）＝濃い青など、直感的にわかる配色 */

async function loadWeatherData(force){
  const pet = state.pet;
  if(!pet || !pet.weatherLoc || pet.weatherLoc.lat==null){ state.weather = null; render(); return; }
  if(!force && state.weather && state.weather.fetchedAt && (Date.now()-state.weather.fetchedAt) < 15*60*1000) return;
  state.weatherLoading = true; state.weatherError = null; render();
  try{
    const { lat, lon } = pet.weatherLoc;
    const params = [
      `latitude=${lat}`, `longitude=${lon}`,
      `current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,is_day`,
      `hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,weather_code,uv_index,is_day`,
      `daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`,
      `timezone=auto`, `forecast_days=8`
    ].join("&");
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if(!res.ok) throw new Error("weather http " + res.status);
    const data = await res.json();
    state.weather = { data, fetchedAt: Date.now() };
    if(state.weatherSelectedDayIdx==null) state.weatherSelectedDayIdx = 0;
  }catch(e){
    console.error("loadWeatherData error", e);

/* ---- 都道府県・市区町村の選択（Geolonia 全国住所データ） ---- */
let jpAddressData = null;      // [{pref, point:[lng,lat], cities:[{code, city, ward, point:[lng,lat]}, ...]}, ...]
let jpAddressLoading = false;
let jpAddressError = null;
let jpCityIndex = {};          // code -> {pref, city, ward, label, lat, lon}
let jpCitiesByPref = {};       // pref -> [{code, label}, ...]

async function ensureJpAddressData(){
  if(jpAddressData || jpAddressLoading) return;
  jpAddressLoading = true; jpAddressError = null; render();
  try{
    const res = await fetch("https://japanese-addresses-v2.geoloniamaps.com/api/ja.json");
    if(!res.ok) throw new Error("address data http " + res.status);
    const json = await res.json();
    jpAddressData = json.data;
    jpCityIndex = {}; jpCitiesByPref = {};
    jpAddressData.forEach(prefObj=>{
      const list = (prefObj.cities||[]).map(c=>{
        const label = c.city + (c.ward || "");
        jpCityIndex[c.code] = { pref: prefObj.pref, city: c.city, ward: c.ward||"", label, lat: c.point[1], lon: c.point[0] };
        return { code: c.code, label };
      });
      jpCitiesByPref[prefObj.pref] = list;
    });
  }catch(e){
    console.error("ensureJpAddressData error", e);
    jpAddressError = "地域データを読み込めませんでした。しばらくしてからもう一度お試しください。";
  }
  jpAddressLoading = false; render();
}
function onWeatherPrefChange(pref){
  state.weatherFormPref = pref;
  state.weatherFormCity = "";
  render();
}
function onWeatherCityChange(code){

function saveWeatherLocation(){
  const code = state.weatherFormCity;
  if(!code){ showToast("市区町村を選択してください"); return; }
  const info = jpCityIndex[code];
  if(!info){ showToast("選択した地域が見つかりませんでした"); return; }
  const labelInput = document.getElementById("set-weather-label");
  const customName = labelInput ? labelInput.value.trim() : "";
  const name = customName || `${info.pref}${info.label}`;
  const weatherLoc = { name, lat: info.lat, lon: info.lon, pref: info.pref, city: info.label };
  state.pet = { ...state.pet, weatherLoc };
  groupRef().set({ weatherLoc }, { merge:true }).catch(e=>console.error("save weatherLoc error", e));
  showToast("お散歩天気の地域を設定しました");
  state.weatherFormPref = ""; state.weatherFormCity = "";
  render();
  loadWeatherData(true);
}

function dayNightIcon(isDay, size){

}

function hourlyForDay(w, dayIdx){
  const dayStr = w.daily.time[dayIdx];
  const idxs = [];
  w.hourly.time.forEach((t,i)=>{
    if(t.slice(0,10) !== dayStr) return;
    const hour = new Date(t).getHours();
    if(hour < 5 || hour > 22) return; // 朝5時〜22時のみ表示
    idxs.push(i);
  });
  return idxs.map(i=>({
    hour: new Date(w.hourly.time[i]).getHours(),
    temp: w.hourly.temperature_2m[i],
    code: w.hourly.weather_code[i],
    judge: judgeWalk({
      temp: w.hourly.temperature_2m[i],
      apparent: w.hourly.apparent_temperature ? w.hourly.apparent_temperature[i] : null,
      code: w.hourly.weather_code[i],
      isDay: w.hourly.is_day ? w.hourly.is_day[i] : 1,
    }),
  }));
}
function goodRangesForDay(w, dayIdx){
  const hours = hourlyForDay(w, dayIdx);
  const ranges = [];
  let start=null, prevHour=null;
  hours.forEach(h=>{
    if(h.judge==="good"){
      if(start===null) start = h.hour;
      prevHour = h.hour;
    } else if(start!==null){
      ranges.push([start, prevHour+1]); start=null;
    }
  });
  if(start!==null) ranges.push([start, prevHour+1]);
  return ranges.map(r => r[1]-r[0]===1 ? `${r[0]}時` : `${r[0]}-${r[1]}時`).join("・");
}
function periodLabel(hour){
  if(hour===5 || hour===8) return "朝";
  if(hour===11 || hour===14) return "昼";
  if(hour===17) return "夕";
  if(hour===20 || hour===23 || hour===2) return "夜";
  return "";
}
function computeWBGT(t, rh){
  if(t==null || rh==null) return null;
  const e = (rh/100) * 6.105 * Math.exp((17.27*t)/(237.7+t));
  return 0.567*t + 0.393*e + 3.94;
}
function wbgtMeta(v){
  if(v>=31) return { label:"危険", bg:"var(--coralSoft)", text:"var(--coralSoftText)" };
  if(v>=28) return { label:"厳重警戒", bg:"var(--coralSoft)", text:"var(--coralSoftText)" };
  if(v>=25) return { label:"警戒", bg:"var(--amber)", text:"var(--amberText)" };
  if(v>=21) return { label:"注意", bg:"var(--amber)", text:"var(--amberText)" };
  return { label:"ほぼ安全", bg:"var(--mint)", text:"var(--mintText)" };
}
function todayPeakStats(w){
  const dayStr = w.daily.time[0];
  const idxs = [];
  w.hourly.time.forEach((t,i)=>{ if(t.slice(0,10) === dayStr) idxs.push(i); });
  if(!idxs.length) return null;
  let peakIdx = idxs[0];
  idxs.forEach(i=>{ if(w.hourly.apparent_temperature[i] > w.hourly.apparent_temperature[peakIdx]) peakIdx = i; });
  const humidity = w.hourly.relative_humidity_2m[peakIdx];
  const ground = idxs.reduce((m,i)=>{
    const v = estimatePavementTemp(w.hourly.temperature_2m[i], w.hourly.weather_code[i], w.hourly.is_day ? w.hourly.is_day[i] : 1);
    return Math.max(m, v);
  }, -Infinity);
  const uv = idxs.reduce((m,i)=> Math.max(m, (w.hourly.uv_index && w.hourly.uv_index[i]) || 0), 0);
  const wbgt = computeWBGT(w.hourly.temperature_2m[peakIdx], humidity);
  return { apparent: w.hourly.apparent_temperature[peakIdx], humidity, ground, uv, wbgt };
}

function buildHourBarGradient(hours){
  if(!hours.length) return "var(--coral)";
  const n = hours.length;
  const stops = hours.map((h,i)=>{
    const color = WEATHER_CAT_STYLE[weatherCategory(h.code)].bg;
    const pct = ((i+0.5)/n*100).toFixed(2);
    return `${color} ${pct}%`;
  });
  return `linear-gradient(to bottom, ${stops.join(", ")})`;
}

/* ================= circular photo cropper ================= */
let cropState = null;
function openCropModal(dataUrl){
  cropState = null;
  state.modal = { type: "cropPhoto", sourceImage: dataUrl };
  render();
  setTimeout(initCropStage, 30);
}
function cancelCropModal(){
  cropState = null;
  closeModal();
}
function initCropStage(){
  const img = document.getElementById("crop-img");
  const stage = document.getElementById("crop-stage");
  if(!img || !stage) return;
  const setup = () => {
    const stageSize = stage.clientWidth;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if(!nw || !nh) return;
    const baseScale = Math.max(stageSize/nw, stageSize/nh);
    cropState = {
      baseScale, scale: 1,
      tx: (stageSize - nw*baseScale)/2,
      ty: (stageSize - nh*baseScale)/2,
      naturalW: nw, naturalH: nh, stageSize,
    };
    applyCropTransform();
    attachCropDragHandlers(stage);
  };
  if(img.complete && img.naturalWidth){ setup(); } else { img.onload = setup; }
}
function applyCropTransform(){
  const img = document.getElementById("crop-img");
  if(!img || !cropState) return;
  const totalScale = cropState.baseScale * cropState.scale;
  img.style.width = cropState.naturalW + "px";
  img.style.height = cropState.naturalH + "px";
  img.style.transform = `translate(${cropState.tx}px, ${cropState.ty}px) scale(${totalScale})`;
}
function clampCropTranslate(){
  const totalScale = cropState.baseScale * cropState.scale;
  const w = cropState.naturalW*totalScale, h = cropState.naturalH*totalScale;
  const s = cropState.stageSize;
  cropState.tx = Math.min(0, Math.max(s - w, cropState.tx));
  cropState.ty = Math.min(0, Math.max(s - h, cropState.ty));
}
function onCropZoomChange(val){
  if(!cropState) return;
  const newScale = Number(val) / 100;
  const s = cropState.stageSize;
  const oldTotal = cropState.baseScale * cropState.scale;
  const newTotal = cropState.baseScale * newScale;
  const cx = (s/2 - cropState.tx) / oldTotal;
  const cy = (s/2 - cropState.ty) / oldTotal;
  cropState.scale = newScale;
  cropState.tx = s/2 - cx*newTotal;
  cropState.ty = s/2 - cy*newTotal;
  clampCropTranslate();
  applyCropTransform();
}
function attachCropDragHandlers(stage){
  if(stage._cropHandlersAttached) return;
  stage._cropHandlersAttached = true;
  let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
  stage.addEventListener("pointerdown", (e) => {
    if(!cropState) return;
    dragging = true;
    stage.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    startTx = cropState.tx; startTy = cropState.ty;
    stage.style.cursor = "grabbing";
  });
  stage.addEventListener("pointermove", (e) => {
    if(!dragging || !cropState) return;
    cropState.tx = startTx + (e.clientX - startX);
    cropState.ty = startTy + (e.clientY - startY);
    clampCropTranslate();
    applyCropTransform();
  });
  const endDrag = () => { dragging = false; stage.style.cursor = "grab"; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointerleave", endDrag);
  stage.addEventListener("pointercancel", endDrag);
}
function confirmCropModal(){
  const img = document.getElementById("crop-img");
  if(!img || !cropState){ closeModal(); return; }
  const outSize = 480;
  const canvas = document.createElement("canvas");
  canvas.width = outSize; canvas.height = outSize;
  const ctx = canvas.getContext("2d");
  const totalScale = cropState.baseScale * cropState.scale;
  const sx = (0 - cropState.tx) / totalScale;
  const sy = (0 - cropState.ty) / totalScale;
  const sSize = cropState.stageSize / totalScale;
  ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, outSize, outSize);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  state.tmpPetPhoto = dataUrl;
  cropState = null;
  closeModal();
}

/* Modal forms are re-rendered from scratch (innerHTML replaced) whenever a
   chip/toggle inside them is clicked, so any value the user has typed into a
   plain <input>/<textarea> (date, time, memo, weight, etc.) is NOT kept in
   `state` and would otherwise be lost/reset to its original default (e.g.
   the datetime field snapping back to "now" or to the record's original
   time). To fix this, we snapshot all current field values right before the
   re-render, and the render functions read from that snapshot via fv(). */
function captureModalFormValues(){
  if(!state.modal) return;
  const sheet = document.querySelector('.modal-sheet');
  if(!sheet) return;
  const vals = {};
  sheet.querySelectorAll('input[id], textarea[id]').forEach(el=>{
    vals[el.id] = (el.type === "checkbox") ? el.checked : el.value;
  });
  state.modal.formValues = vals;
}
function fv(id, def){
  return (state.modal && state.modal.formValues && state.modal.formValues[id] !== undefined) ? state.modal.formValues[id] : def;
}
function setModalSub(field, value){ captureModalFormValues(); state.modalSub[field] = value; render(); }

/* Same problem as above also affects the (non-modal) pet setup and pet
   settings screens: picking a 種類/性別/避妊・去勢 chip re-renders that
   whole screen, which would otherwise wipe out anything typed into the
   plain text/date inputs (name, breed, color, birthday, adopted date,
   microchip number) before the chip was saved. */
function captureFormValues(containerId, storeKey){
  const container = document.getElementById(containerId);
  if(!container) return;
  const vals = {};
  container.querySelectorAll('input[id], textarea[id]').forEach(el=>{
    vals[el.id] = (el.type === "checkbox") ? el.checked : el.value;
  });
  state[storeKey] = vals;
}
function fv2(storeKey, id, def){
  // バックグラウンドでの再描画（天気情報の取得完了など）で入力中の値が
  // 消えないよう、直前のDOMスナップショットを最優先で使う。
  if(state.__formSnapshot && state.__formSnapshot[id] !== undefined) return state.__formSnapshot[id];
  return (state[storeKey] && state[storeKey][id] !== undefined) ? state[storeKey][id] : def;
}
function setPetSetupTmp(field, value){ captureFormValues('pet-setup-card','petSetupFormValues'); state[field] = value; render(); }
function setPetSettingsTmp(field, value){ captureFormValues('pet-settings-card','petSettingsFormValues'); state[field] = value; render(); }

async function saveRecordFromModal(){
  const catKey = state.modal.catKey;

  const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };

    author: editRecord ? (editRecord.author || getMyName()) : getMyName(),
    createdAt: editRecord ? editRecord.createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };

  if(CAT_BY_KEY[catKey]){
    if(catKey === "food" || catKey === "water"){ rec.amount = state.modalSub.amount; }
    if(catKey === "pee"){
      rec.urineColor = state.modalSub.urineColor || "";
      rec.urineAmount = state.modalSub.urineAmount || "";
      rec.photo = state.modalPhoto || null;
      rec.status = state.modalSub.status === "bad" ? "bad" : "good";

      rec.stoolAmount = state.modalSub.stoolAmount || "";
      rec.stoolColor = state.modalSub.stoolColor || "";
      rec.concerns = state.modalSub.concerns || [];
      rec.photo = state.modalPhoto || null;
      rec.status = state.modalSub.status === "bad" ? "bad" : "good";
    }
    if(catKey === "walk"){
      rec.duration = val("rf-duration") ? Number(val("rf-duration")) : null;
      rec.distance = val("rf-distance") ? Number(val("rf-distance")) : null;
      rec.condition = state.modalSub.condition || "";
    }
    if(catKey === "vomit"){
      rec.vomitContent = state.modalSub.vomitContent || "";
      rec.count = val("rf-count") ? Number(val("rf-count")) : 1;
      rec.photo = state.modalPhoto || null;
    }
    if(catKey === "weight"){
      const v = parseFloat(val("rf-weight"));
      if(isNaN(v)){ document.getElementById("rf-err").textContent = "体重を入力してください"; return; }
      rec.value = v;
    }
    if(catKey === "health"){ rec.condition = state.modalSub.condition; }
    if(catKey === "hospital"){ rec.reason = val("rf-reason"); rec.cost = val("rf-cost") ? Number(val("rf-cost")) : null; rec.nextVisit = val("rf-nextvisit"); }
    if(catKey === "medication"){ rec.name = val("rf-medname"); }
    if(catKey === "trimming"){ rec.shop = val("rf-shop"); rec.staff = val("rf-staff"); rec.nextDate = val("rf-nextdate"); }
  }
  if(PREV_BY_KEY[catKey] && PREV_BY_KEY[catKey].group === "vaccine"){
    rec.nextDue = val("rf-nextdue");
    rec.hospital = val("rf-hospital");
    rec.vet = val("rf-vet");
    if(catKey === "vax_rabies"){ rec.certNumber = val("rf-certnumber"); }
  }

  const btn = document.getElementById("rf-submit");
  btn.disabled = true; btn.textContent = "保存中…";
  const prevData = editRecord ? { ...editRecord } : null;
  if(prevData) delete prevData.id;
  try{
    let newId = null;
    if(editRecord){
      await recordsRef().doc(editRecord.id).update(rec);
    } else {
      const docRef = await recordsRef().add(rec);
      newId = docRef.id;
    }
    if(catKey === "hospital" && rec.nextVisit){ await upcomingRef().doc("hospital").set({ label:"通院", date: rec.nextVisit, memo: rec.memo }); }
    if(catKey === "trimming" && rec.nextDate){ await upcomingRef().doc("trimming").set({ label:"トリミング", date: rec.nextDate, memo: rec.memo }); }
    if(PREV_BY_KEY[catKey]){
      const item = PREV_BY_KEY[catKey];
      let dueDate = rec.nextDue || "";
      if(!dueDate){
        const next = new Date(rec.datetime);
        next.setDate(next.getDate() + item.intervalDays);
        dueDate = localDayStr(next);
      }
      await upcomingRef().doc(catKey).set({
        label: `${item.label}${item.group==='vaccine'?'接種':'投与'}`,
        date: dueDate,
        memo: rec.memo,
      });
    }
    closeModal();
    const cat = CAT_BY_KEY[catKey] || PREV_BY_KEY[catKey];
    const statusPart = statusParenLabel(catKey, rec.status);
    if(editRecord){
      showToast(`${cat.label}${statusPart}を更新しました`, async () => {
        await recordsRef().doc(editRecord.id).set(prevData);
        showToast("取り消しました");
        refreshRecordViews();
      });
    } else {
      showToast(`${cat.label}${statusPart}を記録しました`, async () => {
        await recordsRef().doc(newId).delete();
        showToast("取り消しました");
        refreshRecordViews();
      });
    }
    refreshRecordViews();
  }catch(e){
    document.getElementById("rf-err").textContent = "保存できませんでした。通信状況を確認してください。";
    btn.disabled = false; btn.textContent = editRecord ? "保存する" : "記録する";
  }
}

  const typeMeta = EVENT_TYPE_BY_KEY[state.modalSub.eventType] || { label: "予定" };
  const petName = (state.pet && state.pet.name) ? state.pet.name : "";
  const title = [petName, typeMeta.label].filter(Boolean).join(" ・ ");
  const datePart = date.replace(/-/g, "");
  let datesParam;
  if(time){
    const [h, m] = time.split(":").map(Number);
    let endH = h + 1;
    let endDatePart = datePart;
    if(endH >= 24){
      endH -= 24;
      const nextDay = new Date(date + "T00:00:00");
      nextDay.setDate(nextDay.getDate() + 1);
      endDatePart = localDayStr(nextDay).replace(/-/g, "");
    }
    const pad = (n) => String(n).padStart(2, "0");
    const startTimePart = `${pad(h)}${pad(m)}00`;
    const endTimePart = `${pad(endH)}${pad(m)}00`;
    datesParam = `${datePart}T${startTimePart}/${endDatePart}T${endTimePart}`;
  } else {
    const nextDay = new Date(date + "T00:00:00");
    nextDay.setDate(nextDay.getDate() + 1);
    const endPart = localDayStr(nextDay).replace(/-/g, "");
    datesParam = `${datePart}/${endPart}`;
  }
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: datesParam,
    details: memo || "",
    ctz: "Asia/Tokyo"
  });
  window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, "_blank");
}

/* ================= backup / restore (Firestore, no paid features) ================= */
async function fetchAllDocs(ref){
  const snap = await ref.get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function deleteAllDocs(ref){
  const snap = await ref.get();
  const docs = snap.docs;
  const batchSize = 400;
  for(let i=0;i<docs.length;i+=batchSize){
    const batch = db.batch();
    docs.slice(i,i+batchSize).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
}
async function restoreDocsInto(ref, arr){
  const batchSize = 400;
  for(let i=0;i<arr.length;i+=batchSize){
    const batch = db.batch();
    arr.slice(i,i+batchSize).forEach(item=>{
      const { id, ...rest } = item || {};
      const docRef = id ? ref.doc(String(id)) : ref.doc();
      batch.set(docRef, rest);
    });
    await batch.commit();
  }
}
async function downloadBackup(){
  const btn = document.getElementById("backup-download-btn");
  if(btn){ btn.disabled = true; btn.textContent = "作成中…"; }
  try{
    const petSnap = await groupRef().get();
    const pet = petSnap.exists ? petSnap.data() : null;
    const [records, diary, upcoming] = await Promise.all([
      fetchAllDocs(recordsRef()),
      fetchAllDocs(diaryRef()),
      fetchAllDocs(upcomingRef()),
    ]);
    const backup = { version:1, exportedAt:new Date().toISOString(), familyId:FAMILY_ID, pet, records, diary, upcoming };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    const fname = `bukuroku-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert("バックアップの作成に失敗しました。通信状況を確認してもう一度お試しください。");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "バックアップをダウンロード"; }
  }
}

/* ================= CSV export (きろく一覧をスプレッドシートで見る用) =================
   JSONバックアップは復元用にネスト構造・写真base64をそのまま含むが、
   CSVはExcel/スプレッドシートで開いて集計・閲覧するためのもの。
   そのため写真は「あり/なし」のみにし、全記録種別に共通の列へ平らに展開する。 */
const CSV_COLUMNS = [
  { key:"date", header:"日付" },
  { key:"time", header:"時刻" },
  { key:"typeLabel", header:"種類" },
  { key:"amount", header:"量" },
  { key:"statusLabel", header:"様子（成功・失敗）" },
  { key:"urineColor", header:"尿の色" },
  { key:"urineAmount", header:"尿の量" },
  { key:"stoolScore", header:"便スコア" },
  { key:"stoolAmount", header:"便の量" },
  { key:"stoolColor", header:"便の色" },
  { key:"concerns", header:"気になる様子" },
  { key:"vomitContent", header:"嘔吐の内容" },
  { key:"count", header:"回数" },
  { key:"duration", header:"散歩時間（分）" },
  { key:"distance", header:"散歩距離（km）" },
  { key:"condition", header:"様子" },
  { key:"value", header:"体重（kg）" },
  { key:"reason", header:"通院内容" },
  { key:"cost", header:"費用（円）" },
  { key:"nextVisit", header:"次回通院予定" },
  { key:"name", header:"薬の名前" },
  { key:"shop", header:"お店" },
  { key:"staff", header:"担当者" },
  { key:"nextDate", header:"次回トリミング予定" },
  { key:"hospital", header:"動物病院" },
  { key:"vet", header:"担当獣医師" },
  { key:"nextDue", header:"次回予定日" },
  { key:"certNumber", header:"注射済票番号" },
  { key:"memo", header:"メモ" },
  { key:"author", header:"記録者" },
  { key:"hasPhoto", header:"写真" },
];
function recordToCsvRow(r){
  const meta = ALL_TYPE_META[r.type] || { label: r.type };
  return {
    date: r.datetime ? localDayStr(r.datetime) : "",
    time: r.datetime ? fmtTime(r.datetime) : "",
    typeLabel: meta.label || r.type,
    amount: r.amount || "",
    statusLabel: r.status===undefined ? "" : (r.status==="bad" ? "失敗" : "成功"),
    urineColor: r.urineColor || "",
    urineAmount: r.urineAmount || "",
    stoolScore: (r.stoolScore || r.stoolScore===0) ? r.stoolScore : "",
    stoolAmount: r.stoolAmount || "",
    stoolColor: r.stoolColor || "",
    concerns: (r.concerns && r.concerns.length) ? r.concerns.join("・") : "",
    vomitContent: r.vomitContent || "",
    count: (r.count!=null) ? r.count : "",
    duration: (r.duration!=null) ? r.duration : "",
    distance: (r.distance!=null) ? r.distance : "",
    condition: r.condition || "",
    value: (r.value!=null) ? r.value : "",
    reason: r.reason || "",
    cost: (r.cost!=null) ? r.cost : "",
    nextVisit: r.nextVisit || "",
    name: r.name || "",
    shop: r.shop || "",
    staff: r.staff || "",
    nextDate: r.nextDate || "",
    hospital: r.hospital || "",
    vet: r.vet || "",
    nextDue: r.nextDue || "",
    certNumber: r.certNumber || "",
    memo: r.memo || "",
    author: r.author || "",
    hasPhoto: r.photo ? "あり" : "",
  };
}
function csvEscape(val){
  if(val === null || val === undefined) return "";
  const s = String(val);
  return /[",\n\r]/.test(s) ? ('"' + s.replace(/"/g,'""') + '"') : s;
}
async function downloadRecordsCsv(){
  const btn = document.getElementById("csv-download-btn");
  if(btn){ btn.disabled = true; btn.textContent = "作成中…"; }
  try{
    const records = await fetchAllDocs(recordsRef());
    records.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
    const lines = [CSV_COLUMNS.map(c => csvEscape(c.header)).join(",")];
    records.forEach(r => {
      const row = recordToCsvRow(r);
      lines.push(CSV_COLUMNS.map(c => csvEscape(row[c.key])).join(","));
    });
    /* 先頭にBOMを付けて、ExcelでUTF-8の日本語が文字化けしないようにする */
    const csvContent = "\uFEFF" + lines.join("\r\n");
    const blob = new Blob([csvContent], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    const fname = `bukuroku-records-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error("downloadRecordsCsv error", e);
    alert("CSVの作成に失敗しました。通信状況を確認してもう一度お試しください。");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "CSVでエクスポート（きろく一覧）"; }
  }
}
async function restoreBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!confirm("現在のデータをバックアップの内容で置き換えます。よろしいですか？")){ input.value = ""; return; }

  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    alert("バックアップファイルの読み込みに失敗しました。ファイルが壊れている可能性があります。");
    input.value = "";
    return;
  }
  if(!data || typeof data !== "object" || !Array.isArray(data.records) || !Array.isArray(data.diary) || !Array.isArray(data.upcoming)){
    alert("バックアップファイルの形式が正しくありません。");
    input.value = "";
    return;
  }

  const btn = document.getElementById("backup-restore-btn");
  if(btn){ btn.disabled = true; btn.textContent = "復元中…"; }
  try{
    // 表示順はFirestore側のorderBy()が制御するため、ここでのソートは
    // データの一貫性・デバッグのしやすさのため。datetime/dateの値自体は
    // バックアップの内容をそのまま書き戻す（現在時刻での上書きはしない）。
    const sortedRecords = [...data.records].sort((a,b) => new Date(a.datetime||0) - new Date(b.datetime||0));
    const sortedDiary = [...data.diary].sort((a,b) => new Date(a.date||0) - new Date(b.date||0));
    await deleteAllDocs(recordsRef());
    await deleteAllDocs(diaryRef());
    await deleteAllDocs(upcomingRef());
    if(data.pet) await groupRef().set(data.pet);
    await restoreDocsInto(recordsRef(), sortedRecords);
    await restoreDocsInto(diaryRef(), sortedDiary);
    await restoreDocsInto(upcomingRef(), data.upcoming);
  }catch(e){
    alert("Firestoreへの書き込みに失敗しました。通信状況を確認してもう一度お試しください。");
    if(btn){ btn.disabled = false; btn.textContent = "バックアップから復元"; }
    input.value = "";
    return;
  }
  input.value = "";
  if(btn){ btn.disabled = false; btn.textContent = "バックアップから復元"; }
  await loadPet();
  render();
  await loadHome();
  await loadHistory();
  await loadWeight();
  await loadDiary();
  showToast("バックアップから復元しました");
}

function relativeDayLabel(dateStr){
  const target = new Date(dateStr+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((target-today)/86400000);
  const days = ["日","月","火","水","木","金","土"];
  let text, tone;
  if(diffDays === 0){ text = "今日"; tone = "soon"; }
  else if(diffDays === 1){ text = "明日"; tone = "soon"; }
  else if(diffDays < 0){ text = `${Math.abs(diffDays)}日前`; tone = "overdue"; }
  else { text = `あと${diffDays}日`; tone = diffDays <= 7 ? "soon" : "later"; }
  return { text, tone, month: target.getMonth()+1, day: target.getDate(), weekday: days[target.getDay()] };
}

      <span class="chip" style="background:var(--chip);color:var(--chipText);border:none;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px dashed var(--mintText);margin-right:5px;vertical-align:middle;"></span>避妊・去勢 ${pet.neuter==='done'?'済':pet.neuter==='not'?'未':'未設定'}</span>
      ${pet.adoptedDate ? `<span class="chip" style="background:var(--chip);color:var(--chipText);border:none;">🏠 お迎え ${esc(pet.adoptedDate)}${daysSince(pet.adoptedDate)!=null?`（${daysSince(pet.adoptedDate)}日目）`:""}</span>` : ""}
      ${pet.microchip ? `<span class="chip mono" style="background:var(--chip);color:var(--chipText);border:none;">💳 マイクロチップ ${esc(pet.microchip)}</span>` : ""}
    </div>` : ""}

    ${age ? `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
      <div><span class="mono" style="font-size:26px;font-weight:600;">${age.days}</span><span style="font-size:12px;color:var(--inkSoft);"> 日 生後</span>${daysSince(pet.adoptedDate)!=null?` <span class="mono" style="font-size:26px;font-weight:600;margin-left:10px;">${daysSince(pet.adoptedDate)}</span><span style="font-size:12px;color:var(--inkSoft);"> 日 一緒に過ごした</span>`:""}</div>
      <div style="font-size:12.5px;color:var(--inkSoft);margin-top:4px;">${age.years>0?`${age.years}歳${age.months}ヶ月`:`生後${age.months}ヶ月`}${human?` ・ 人間${human}歳`:""} ・ <span style="background:var(--chip);color:var(--chipText);padding:2px 9px;border-radius:999px;">${age.stage}</span></div>
    </div>` : ""}
  </div>

  <div style="font-size:12.5px;font-weight:700;color:var(--inkSoft);margin:4px 2px 8px;">📋 日々のお世話</div>
  ${state.homeLoading ? `<div style="text-align:center;padding:20px;"><span class="spin">⏳</span></div>` : renderCategoryRows(DAILY_CATEGORIES.filter(c=>!isCategoryHidden(c.key)), lastByType)}

  ${renderHealthSection(lastByType)}
  `;
}

function renderCategoryRows(list, lastByType){
  return list.map(c => {
    const last = lastByType[c.key];
    const subtitle = last ? `${esc(summarizeRecord(last))} ・ ${timeAgo(last.datetime)}` : "まだ記録なし";
    let action = "";
    if(c.quick === "binary"){
      action = `
        <button class="row-btn good" onclick="openRecordModal('${c.key}', null, null, 'good')">✓ 成功</button>
        <button class="row-btn bad" onclick="openRecordModal('${c.key}', null, null, 'bad')">✕ 失敗</button>`;
    } else if(c.quick === "instant"){
      action = `<button class="row-btn" onclick="quickLog('${c.key}',{amount:'ふつう'})">記録</button>`;
    } else {
      action = `<button class="row-btn" onclick="openRecordModal('${c.key}')">記録</button>`;
    }
    return `
    <div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;">
      <button onclick="openRecordModal('${c.key}')" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;">
        <div class="icon-circle">${c.emoji}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:15px;">${c.label}</div>
          <div style="font-size:12px;color:var(--inkSoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${subtitle}</div>
        </div>
      </button>
      <div style="display:flex;gap:8px;flex-shrink:0;">${action}</div>
    </div>`;
  }).join("");
}

function renderPreventiveRow(item, lastByType){
  const last = lastByType[item.key];
  const subtitle = last ? `前回 ${localDayStr(last.datetime)}${last.memo?(' ・ '+esc(last.memo)):''}` : "まだ記録がありません";
  const btnLabel = item.group==="vaccine" ? "接種" : "投与";
  return `
  <div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;">
    <button onclick="openRecordModal('${item.key}')" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;">
      <div class="icon-circle" style="background:var(--coralSoft);">${item.emoji}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:15px;">${item.label}</div>
        <div style="font-size:12px;color:var(--inkSoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${subtitle}</div>
      </div>
    </button>
    <button class="row-btn" onclick="openRecordModal('${item.key}')">${btnLabel}</button>
  </div>`;
}

function renderHealthSection(lastByType){
  const open = state.healthSectionOpen !== false;
  const header = `
  <div class="card" style="padding:14px 16px;margin-top:18px;margin-bottom:${open?'12px':'0'};display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="state.healthSectionOpen=${open?'false':'true'};render();">
    <div style="width:42px;height:42px;border-radius:50%;background:var(--coralSoft);display:flex;align-items:center;justify-content:center;font-size:19px;">❤️</div>
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;font-size:15px;">健康・予防の管理</div>
      <div style="font-size:11.5px;color:var(--inkSoft);">ワクチン・お薬・トリミング・体重</div>
    </div>
    <div style="font-size:13px;color:var(--inkSoft);">${open?'︿':'﹀'}</div>
  </div>`;
  if(!open) return header;

  const vaxRows = PREVENTIVE_ITEMS.filter(p=>p.group==="vaccine").map(p=>renderPreventiveRow(p, lastByType)).join("");
  const medRows = PREVENTIVE_ITEMS.filter(p=>p.group==="medicine").map(p=>renderPreventiveRow(p, lastByType)).join("");
  const generalRows = renderCategoryRows(HEALTH_CATEGORIES.filter(c=>!isCategoryHidden(c.key)), lastByType);

  return header + `
  <div style="font-size:12px;font-weight:700;color:var(--inkSoft);margin:2px 2px 8px;">💉 予防・ワクチン</div>
  ${vaxRows}
  <div class="card" style="padding:12px 14px;margin:6px 0 14px;background:var(--mint);display:flex;gap:8px;align-items:flex-start;">
    <span style="font-size:14px;">ℹ️</span>
    <div style="font-size:12px;color:var(--mintText);line-height:1.6;">前回接種した日がわかれば入力しておくと、次回の目安が上の「次回の予定」に表示されます。わからない場合は動物病院に確認すると安心です。</div>
  </div>
  <div style="font-size:12px;font-weight:700;color:var(--inkSoft);margin:4px 2px 8px;">💊 予防のお薬（月1回の目安）</div>
  ${medRows}
  <div style="font-size:12px;font-weight:700;color:var(--inkSoft);margin:14px 2px 8px;">🩺 その他の健康管理</div>
  ${generalRows}
  `;
}

function openPetEdit(){
  state.tab = "settings"; state.modal = null;
  if(state.pet){
    state.tmpSpecies = state.pet.species;
    state.tmpGender = state.pet.gender || "unknown";
    state.tmpNeuter = state.pet.neuter || "unknown";
    state.tmpPetPhoto = state.pet.photo || null;
  }
  state.petSettingsFormValues = null;
  render();
}

/* ================= HISTORY (list / calendar / memories) ================= */
function renderHistory(){
  const sub = state.historySubTab || "list";
  return `
  <div class="display" style="font-weight:700;font-size:19px;margin-bottom:12px;">きろく</div>
  <div class="subtab-wrap">
    <button class="subtab-btn ${sub==='list'?'active':''}" onclick="switchHistorySubTab('list')">リスト</button>
    <button class="subtab-btn ${sub==='calendar'?'active':''}" onclick="switchHistorySubTab('calendar')">カレンダー</button>
    <button class="subtab-btn ${sub==='memories'?'active':''}" onclick="switchHistorySubTab('memories')">おもいで</button>
  </div>
  ${sub==='list' ? renderHistoryList() : sub==='calendar' ? renderHistoryCalendar() : renderDiary()}
  `;
}

function renderHistoryList(){
  const stats = state.stats;
  const statsBlock = `
  <div class="chip-row" style="margin-bottom:12px;">
    ${[7,14,30].map(d=>`<button class="chip ${state.statsPeriod===d?'active':''}" onclick="setStatsPeriod(${d})">${d}日</button>`).join("")}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:18px;">
    <div class="card" style="flex:1;padding:14px 16px;">
      <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:6px;">おしっこ成功率</div>
      <div style="display:flex;align-items:baseline;gap:6px;">
        <span class="mono" style="font-size:24px;font-weight:600;">${!stats ? "…" : (stats.peeRate===null?"-":stats.peeRate+"%")}</span>
        ${stats && stats.peeCount>0 ? `<span class="mono" style="font-size:12px;color:var(--inkSoft);">(${stats.peeGood}/${stats.peeCount}回)</span>` : ""}
      </div>
    </div>
    <div class="card" style="flex:1;padding:14px 16px;">
      <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:6px;">うんち成功率</div>
      <div style="display:flex;align-items:baseline;gap:6px;">
        <span class="mono" style="font-size:24px;font-weight:600;">${!stats ? "…" : (stats.poopRate===null?"-":stats.poopRate+"%")}</span>
        ${stats && stats.poopCount>0 ? `<span class="mono" style="font-size:12px;color:var(--inkSoft);">(${stats.poopGood}/${stats.poopCount}回)</span>` : ""}
      </div>
    </div>
  </div>`;

  const grouped = {};
  state.historyRecords.forEach(r => {
    const day = r.datetime ? localDayStr(r.datetime) : "";
    if(!grouped[day]) grouped[day] = [];
    grouped[day].push(r);
  });
  const dayKeys = Object.keys(grouped).sort().reverse();

  return statsBlock + (
    state.historyLoading && state.historyRecords.length===0 ? `<div style="text-align:center;padding:30px;"><span class="spin">⏳</span></div>` :
    dayKeys.length===0 ? `<div style="text-align:center;padding:40px 20px;color:var(--inkSoft);font-size:13.5px;">まだ記録がありません。</div>` :
    dayKeys.map(day => `
      <div style="margin-bottom:16px;">
        <div class="mono" style="font-size:12px;color:var(--inkSoft);margin-bottom:6px;">${fmtDateHeading(day)}</div>
        <div class="card" style="overflow:hidden;">
          ${grouped[day].map((r,i)=> renderRecordRow(r, {divider: i>0})).join("")}
        </div>
      </div>`).join("")
  ) + (state.historyHasMore ? `<button onclick="loadMoreHistory()" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--inkSoft);font-size:13px;cursor:pointer;">もっと読み込む</button>` : "")
    + `<div style="font-size:11.5px;color:var(--inkSoft);text-align:center;margin-top:10px;">記録をタップすると編集・削除できます</div>`;
}

function renderHistoryCalendar(){
  const { y, m } = state.calendarMonth;
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayStr = localDayStr(new Date());

  const dayHasRecord = {};
  const dayHasEvent = {};
  state.calendarRecords.forEach(r => { dayHasRecord[localDayStr(r.datetime)] = true; });
  state.calendarEvents.forEach(e => { dayHasEvent[e.date] = true; });

  const weekLabels = ["日","月","火","水","木","金","土"];
  let cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const grid = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <button onclick="changeCalendarMonth(-1)" class="toppill">‹</button>
    <div class="display" style="font-weight:700;font-size:17px;">${y}年${m}月</div>
    <button onclick="changeCalendarMonth(1)" class="toppill">›</button>
  </div>
  <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;color:var(--inkSoft);">
    <span style="display:flex;align-items:center;gap:4px;"><span style="font-size:11px;">📅</span>予定がある日</span>
    <span style="display:flex;align-items:center;gap:4px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--coral);display:inline-block;"></span>記録がある日</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
    ${weekLabels.map((w,i)=>`<div style="text-align:center;font-size:11px;color:${i===0?'var(--coral)':i===6?'var(--chipText)':'var(--inkSoft)'};font-weight:600;">${w}</div>`).join("")}
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;">
    ${cells.map(d=>{
      if(d===null) return `<div></div>`;
      const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const isToday = dateStr===todayStr;
      const isSelected = dateStr===state.calendarSelectedDay;
      const hasRecord = !!dayHasRecord[dateStr];
      const hasEvent = !!dayHasEvent[dateStr];
      return `
      <button onclick="selectCalendarDay('${dateStr}')" style="position:relative;aspect-ratio:1/1;border-radius:10px;border:${isSelected?'2px solid var(--coral)':'1px solid transparent'};background:${isSelected?'var(--coralSoft)':'var(--card)'};display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        ${hasEvent?`<span style="position:absolute;top:3px;right:4px;font-size:9px;line-height:1;">📅</span>`:""}
        <span style="font-size:13px;color:${isToday?'var(--coral)':'var(--ink)'};font-weight:${isToday?'700':'400'};">${d}</span>
        ${hasRecord?`<span style="width:5px;height:5px;border-radius:50%;background:var(--coral);margin-top:2px;"></span>`:""}
      </button>`;
    }).join("")}
  </div>`;

  return (state.calendarLoading ? `<div style="text-align:center;padding:20px;"><span class="spin">⏳</span></div>` : "") + grid + renderCalendarDayPanel();
}

function renderCalendarDayPanel(){
  const day = state.calendarSelectedDay;
  const dayRecords = state.calendarRecords.filter(r=>localDayStr(r.datetime)===day).sort((a,b)=> b.datetime.localeCompare(a.datetime));
  const dayEvents = state.calendarEvents.filter(e=>e.date===day).sort((a,b)=> (b.time||"").localeCompare(a.time||""));
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;">
    <div style="font-weight:700;font-size:15px;">${fmtDateHeading(day+"T00:00:00")}</div>
    <button class="row-btn" onclick="openEventModal('${day}')">📅 予定を追加</button>
  </div>
  ${dayEvents.length ? `
  <div style="display:flex;align-items:center;gap:6px;margin:2px 2px 8px;">
    <span style="font-size:12.5px;font-weight:700;color:var(--amberText);">📅 予定</span>
    <span class="mono" style="font-size:11px;color:var(--amberText);background:var(--amber);padding:1px 8px;border-radius:999px;">${dayEvents.length}件</span>
  </div>
  <div class="card" style="overflow:hidden;margin-bottom:18px;background:#FDF6E9;border:1px solid var(--amber);">
    ${dayEvents.map((ev,i)=>{
      const meta = EVENT_TYPE_BY_KEY[ev.type] || { emoji:"🗓️", label: ev.type };
      return `
      <div onclick='openEventModal(${JSON.stringify(day)}, ${JSON.stringify(ev.id)})' style="display:flex;gap:10px;padding:12px 14px;${i>0?'border-top:1px solid var(--amber);':''}cursor:pointer;align-items:center;">
        <span style="font-size:18px;flex-shrink:0;">${meta.emoji}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14px;">${esc(meta.label)}${ev.time?` ・ ${esc(ev.time)}`:""}</div>
          ${ev.memo?`<div style="font-size:12px;color:var(--amberText);">${esc(ev.memo)}</div>`:""}
        </div>
      </div>`;
    }).join("")}
  </div>` : ""}
  ${dayRecords.length===0 && dayEvents.length===0 ? `<div style="text-align:center;padding:16px;color:var(--inkSoft);font-size:13px;">この日の記録はありません</div>` : ""}
  ${dayRecords.length ? `
  <div style="display:flex;align-items:center;gap:6px;margin:2px 2px 8px;">
    <span style="font-size:12.5px;font-weight:700;color:var(--inkSoft);">📋 記録</span>
    <span class="mono" style="font-size:11px;color:var(--chipText);background:var(--chip);padding:1px 8px;border-radius:999px;">${dayRecords.length}件</span>
  </div>
  <div class="card" style="overflow:hidden;margin-bottom:8px;">
    ${dayRecords.map((r,i)=> renderRecordRow(r, {divider: i>0})).join("")}
  </div>` : ""}
  <button onclick="openPastRecordPicker('${day}')" style="width:100%;padding:11px;margin-top:6px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--inkSoft);font-size:13px;cursor:pointer;">＋ 過去の記録を追加</button>
  `;
}

/* ================= DIARY / おもいで (list with date + author, tap to edit) ================= */
function renderDiary(){

      <div class="card" onclick='openDiaryEdit(${JSON.stringify(e.id)})' style="display:flex;gap:12px;padding:12px;margin-bottom:10px;cursor:pointer;align-items:center;">
        <div style="width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--cardSoft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;">
          ${e.photo ? `<img src="${e.photo}" style="width:100%;height:100%;object-fit:cover;">` : (e.mood==="元気"?"😊":e.mood==="不調"?"😟":"😐")}

  `;
}

/* ================= modals ================= */
function renderModal(){
  if(!state.modal) return "";
  if(state.modal.type === "record") return renderRecordModal();
  if(state.modal.type === "diary") return renderDiaryModal();
  if(state.modal.type === "event") return renderEventModal();
  if(state.modal.type === "pickCategory") return renderPickCategoryModal();
  if(state.modal.type === "cropPhoto") return renderCropModal();
  if(state.modal.type === "weather") return renderWeatherModal();
  return "";
}
function chipField(label, options, current, subKey){
  return `<div class="field"><div class="field-label">${label}</div><div class="chip-row">
    ${options.map(o=>`<button class="chip ${current===o?'active':''}" onclick="setModalSub('${subKey}','${o}')">${o}</button>`).join("")}
  </div></div>`;
}
function renderRecordPhotoField(){
  return `
  <div class="field">
    <div class="field-label">写真（任意）</div>
    <input type="file" accept="image/*" id="rf-photo-file" style="display:none" onchange="handleRecordPhoto(this)">
    <div id="rf-photobox" onclick="document.getElementById('rf-photo-file').click()" style="display:flex;align-items:center;justify-content:center;min-height:90px;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);cursor:pointer;overflow:hidden;">
      ${state.modalPhoto ? `<img src="${state.modalPhoto}" style="width:100%;border-radius:10px;display:block;">` : `<span class="mono" style="font-size:13px;color:var(--inkSoft);">📷 写真を追加</span>`}
    </div>
  </div>`;
}
function renderRecordModal(){
  const catKey = state.modal.catKey;
  const editRecord = state.modal.editRecord;
  const cat = CAT_BY_KEY[catKey] || PREV_BY_KEY[catKey];
  const prevItem = PREV_BY_KEY[catKey];
  const isVaccine = prevItem && prevItem.group === "vaccine";
  const sub = state.modalSub;
  let fields = "";
  if(catKey === "food"){ fields = chipField("量", ["少なめ","ふつう","多め","残した"], sub.amount, "amount"); }
  else if(catKey === "water"){ fields = chipField("量の目安", ["少なめ","ふつう","多め"], sub.amount, "amount"); }
  else if(catKey === "pee"){
    fields = `
      <div class="field"><div class="field-label">様子</div><div class="chip-row">
        <button class="chip ${sub.status!=='bad'?'active':''}" onclick="setModalSub('status','good')">✓ 成功</button>
        <button class="chip ${sub.status==='bad'?'active':''}" onclick="setModalSub('status','bad')">✕ 失敗</button>
      </div></div>
      ${chipField("尿の色（あれば選択）", URINE_COLORS, sub.urineColor, "urineColor")}
      ${chipField("量（あれば選択）", URINE_AMOUNTS, sub.urineAmount, "urineAmount")}
      ${renderRecordPhotoField()}
    `;
  } else if(catKey === "poop"){
    fields = `
      <div class="field"><div class="field-label">様子</div><div class="chip-row">
        <button class="chip ${sub.status!=='bad'?'active':''}" onclick="setModalSub('status','good')">✓ 成功</button>
        <button class="chip ${sub.status==='bad'?'active':''}" onclick="setModalSub('status','bad')">✕ 失敗</button>
      </div></div>
      <div style="font-size:11.5px;color:var(--inkSoft);margin:-6px 0 12px;line-height:1.6;">下痢や便に異物が混ざる状態が続く場合は、誤食や消化器の不調の可能性もあります。心配なときは動物病院にご相談ください。</div>
      <div class="field">
        <div class="field-label">便の状態（あれば選択）</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${STOOL_SCALE.map(s=>`
          <button onclick="setModalSub('stoolScore',${s.score})" style="display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:12px;border:${sub.stoolScore===s.score?'2px solid var(--coral)':'1px solid var(--line)'};background:${sub.stoolScore===s.score?'var(--coralSoft)':'#fff'};cursor:pointer;">
            <span class="mono" style="width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--chipText);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">${s.score}</span>
            <span style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:13.5px;">${s.label}</div>
              <div style="font-size:11.5px;color:var(--inkSoft);">${s.desc}</div>
            </span>
          </button>`).join("")}
        </div>
      </div>
      ${chipField("量（あれば選択）", STOOL_AMOUNTS, sub.stoolAmount, "stoolAmount")}
      ${chipField("便の色（あれば選択）", STOOL_COLORS, sub.stoolColor, "stoolColor")}
      ${multiChipField("気になる様子（あれば選択）", STOOL_CONCERNS, sub.concerns, "concerns")}
      ${renderRecordPhotoField()}
    `;
  } else if(catKey === "walk"){
    fields = `
      <div class="field-row">
        <label class="field"><div class="field-label">時間（分・任意）</div><input id="rf-duration" type="number" min="1" step="1" placeholder="例：20" value="${fv('rf-duration', editRecord&&editRecord.duration?editRecord.duration:'')}"></label>
        <label class="field"><div class="field-label">距離（km・任意）</div><input id="rf-distance" type="number" step="0.1" min="0" placeholder="例：1.5" value="${fv('rf-distance', editRecord&&editRecord.distance?editRecord.distance:'')}"></label>
      </div>
      ${chipField("様子（あれば選択）", ["元気","普通","いまいち"], sub.condition, "condition")}
    `;
  } else if(catKey === "vomit"){
    fields = `
      <div style="font-size:11.5px;color:var(--inkSoft);margin:-6px 0 12px;line-height:1.6;">血が混じる・繰り返す場合は早めに動物病院にご相談ください。</div>
      ${chipField("内容（あれば選択）", VOMIT_CONTENTS, sub.vomitContent, "vomitContent")}
      <label class="field"><div class="field-label">回数</div><input id="rf-count" type="number" min="1" step="1" value="${fv('rf-count', editRecord&&editRecord.count?editRecord.count:1)}"></label>
      ${renderRecordPhotoField()}
    `;
  } else if(catKey === "weight"){
    fields = `<label class="field"><div class="field-label">体重（kg）</div><input id="rf-weight" type="number" step="0.01" placeholder="例：4.20" value="${fv('rf-weight', editRecord?editRecord.value:'')}"></label>`;
  } else if(catKey === "health"){
    fields = chipField("今日の様子", ["元気","普通","不調"], sub.condition, "condition");
  } else if(catKey === "hospital"){
    fields = `
      <label class="field"><div class="field-label">内容・理由</div><input id="rf-reason" placeholder="例：定期健診" value="${esc(editRecord?editRecord.reason:'')}"></label>
      <div class="field-row">
        <label class="field"><div class="field-label">費用（円・任意）</div><input id="rf-cost" type="number" value="${editRecord&&editRecord.cost?editRecord.cost:''}"></label>
        <label class="field"><div class="field-label">次回の予定（任意）</div><input id="rf-nextvisit" type="date" value="${esc(editRecord?editRecord.nextVisit||'':'')}"></label>
      </div>`;
  } else if(catKey === "medication"){
    fields = `<label class="field"><div class="field-label">薬の名前</div><input id="rf-medname" placeholder="例：フィラリア予防薬" value="${esc(editRecord?editRecord.name:'')}"></label>`;
  } else if(catKey === "trimming"){
    fields = `
      <div class="field-row">
        <label class="field"><div class="field-label">お店（任意）</div><input id="rf-shop" value="${esc(editRecord?editRecord.shop||'':'')}"></label>
        <label class="field"><div class="field-label">担当者（任意）</div><input id="rf-staff" value="${esc(editRecord?editRecord.staff||'':'')}"></label>
      </div>
      <label class="field"><div class="field-label">次回の予定（任意）</div><input id="rf-nextdate" type="date" value="${esc(editRecord?editRecord.nextDate||'':'')}"></label>`;
  } else if(isVaccine){
    const baseDate = editRecord ? toLocalInputValue(editRecord.datetime).slice(0,10) : (state.modal.presetDay || localDayStr(new Date()));
    let nextDueDefault = editRecord && editRecord.nextDue ? editRecord.nextDue : "";
    if(!nextDueDefault){
      const d = new Date(baseDate+"T00:00:00");
      d.setDate(d.getDate() + prevItem.intervalDays);
      nextDueDefault = localDayStr(d);
    }
    fields = `
      <label class="field"><div class="field-label">次回予定（自動計算・変更可）</div><input id="rf-nextdue" type="date" value="${esc(nextDueDefault)}"></label>
      <label class="field"><div class="field-label">動物病院（任意）</div><input id="rf-hospital" placeholder="例：〇〇動物病院" value="${esc(editRecord?editRecord.hospital||'':'')}"></label>
      <label class="field"><div class="field-label">担当獣医師（任意）</div><input id="rf-vet" placeholder="例：△△先生" value="${esc(editRecord?editRecord.vet||'':'')}"></label>
      ${catKey==="vax_rabies" ? `
      <div class="card" style="padding:14px;margin:6px 0 14px;background:var(--coralSoft);">
        <div style="font-weight:700;font-size:13px;color:var(--coralDeep);margin-bottom:8px;">🏷️ 狂犬病予防注射済票</div>
        <label class="field" style="margin-bottom:6px;"><div class="field-label">注射済票番号（任意）</div><input id="rf-certnumber" placeholder="例：2026-12345" value="${esc(editRecord?editRecord.certNumber||'':'')}"></label>
        <div style="font-size:11px;color:var(--coralDeep);line-height:1.6;">注射済票は市区町村が交付する公的な標識です。番号・形式は自治体ごとに異なります。ここでの記録は補助的な控えとしてご利用ください。</div>
      </div>` : ""}
    `;
  }
  const dtDate = fv('rf-date', editRecord ? toLocalInputValue(editRecord.datetime).slice(0,10) : (state.modal.presetDay || localDayStr(new Date())));
  const dtTime = fv('rf-time', editRecord ? toLocalInputValue(editRecord.datetime).slice(11,16) : (state.modal.presetDay ? "12:00" : nowLocalInput().slice(11,16)));
  const memoValue = esc(fv('rf-memo', editRecord ? (editRecord.memo||"") : ""));
  const modalTitle = isVaccine ? `${cat.label}ワクチンを${editRecord?'編集':'記録'}` : `${cat.label}を${editRecord?'編集':'記録'}`;
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">

        <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:18px;">✕</button>
      </div>
      ${isVaccine ? `
      <label class="field"><div class="field-label">接種した日</div><input id="rf-date" type="date" value="${dtDate}"></label>
      <input id="rf-time" type="hidden" value="12:00">
      ` : `
      <div class="field-row">
        <label class="field"><div class="field-label">日付</div><input id="rf-date" type="date" value="${dtDate}"></label>
        <label class="field"><div class="field-label">時刻</div><input id="rf-time" type="time" value="${dtTime}"></label>
      </div>
      `}
      ${fields}
      <label class="field"><div class="field-label">メモ（任意）</div><textarea id="rf-memo" rows="2" placeholder="${isVaccine?'ロット番号・体調など':''}">${memoValue}</textarea></label>
      ${catKey==="health" ? `<div style="font-size:11.5px;color:var(--inkSoft);margin-bottom:10px;line-height:1.6;">※ここでの記録は診断ではありません。気になる様子があるときは動物病院にご相談ください。</div>` : ""}
      <div id="rf-err" style="color:var(--coral);font-size:12.5px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;">
        ${editRecord ? "" : `<button class="btn-secondary" onclick="closeModal()">キャンセル</button>`}
        <button id="rf-submit" class="btn-primary" style="flex:1;" onclick="saveRecordFromModal()">${editRecord?'保存する':'記録する'}</button>
        ${editRecord ? `<button class="btn-danger" onclick="deleteRecordFromModal()">削除</button>` : ""}
      </div>
    </div>
  </div>`;
}
function renderDiaryModal(){

  const captionVal = esc(fv('df-caption', e ? (e.caption||"") : ""));
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">

/* ================= master render ================= */
const TABS = [
  {key:"home", label:"ホーム", emoji:"🏠"},
  {key:"history", label:"きろく", emoji:"📖"},
  {key:"weight", label:"体重", emoji:"⚖️"},
  {key:"settings", label:"設定", emoji:"⚙️"},
];

/* render() replaces #app's innerHTML wholesale, which destroys and recreates
   every DOM node — including whichever <input>/<textarea> the user currently
   has focused (e.g. typing a memo, then tapping a category chip elsewhere in
   the same form triggers a re-render). Without this, focus silently falls
   back to <body>, the on-screen keyboard on mobile closes, and the user has
   to tap back into the memo field and find their place again. We snapshot
   the focused field's id, cursor position, and the modal's scroll offset
   right before the innerHTML swap, then restore all three right after. */
function captureFocusState(root){
  // モーダル内のスクロール位置は、フォーカスが input/textarea かどうかに関係なく
  // 常に記録する。うんち・おしっこの記録ポップアップ内にある「様子」「量」などの
  // chip ボタンをタップした場合、アクティブ要素は <button> になるため、以前は
  // ここで早期リターンしてスクロール位置が保存されず、再描画のたびにポップアップが
  // 先頭へ戻ってしまっていた。
  // 同じ理由で、モーダルを使わないページ（ペット初期設定・設定画面の犬種／性別／
  // 避妊去勢チップなど）ではページ全体（window）がスクロールするため、そちらの
  // スクロール位置も合わせて記録しておく。
  const existingSheet = root.querySelector(".modal-sheet");
  const sheetScrollTop = existingSheet ? existingSheet.scrollTop : null;
  const pageScrollX = window.scrollX;
  const pageScrollY = window.scrollY;

  const active = document.activeElement;
  if(!active || !active.id || !root.contains(active)) return { sheetScrollTop, pageScrollX, pageScrollY };
  if(active.tagName !== "INPUT" && active.tagName !== "TEXTAREA") return { sheetScrollTop, pageScrollX, pageScrollY };
  return {
    id: active.id,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null,
    sheetScrollTop,
    pageScrollX,
    pageScrollY,
  };
}
function applySheetScrollTop(value){
  const sheet = document.querySelector(".modal-sheet");
  if(sheet) sheet.scrollTop = value;
}
function restoreFocusState(info){
  if(!info) return;
  if(info.sheetScrollTop!=null){
    // 同期的に一度セットするだけでは、モバイル端末（特にiOS Safari）で
    // タップ後のフォーカス処理が後から走り、せっかく戻したスクロール位置を
    // 上書きしてしまうことがある。そのため rAF / setTimeout でも再適用し、
    // 確実にスクロール位置を保つ。
    applySheetScrollTop(info.sheetScrollTop);
    requestAnimationFrame(() => {
      applySheetScrollTop(info.sheetScrollTop);
      requestAnimationFrame(() => applySheetScrollTop(info.sheetScrollTop));
    });
    setTimeout(() => applySheetScrollTop(info.sheetScrollTop), 60);
  }
  if(info.pageScrollX!=null && info.pageScrollY!=null){
    const restorePageScroll = () => window.scrollTo(info.pageScrollX, info.pageScrollY);
    restorePageScroll();
    requestAnimationFrame(() => {
      restorePageScroll();
      requestAnimationFrame(restorePageScroll);
    });
    setTimeout(restorePageScroll, 60);
  }
  if(!info.id) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  el.focus({preventScroll:true});
  if(info.selectionStart!=null && typeof el.setSelectionRange === "function"){
    try{ el.setSelectionRange(info.selectionStart, info.selectionEnd); }catch(e){}
  }
}

function render(){
  const app = document.getElementById("app");
  const focusInfo = captureFocusState(app);
  const snap = {};
  app.querySelectorAll('input[id], textarea[id]').forEach(el=>{
    snap[el.id] = (el.type === "checkbox") ? el.checked : el.value;
  });
  state.__formSnapshot = snap;

  if(!authReady){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span class="spin" style="font-size:24px;">⏳</span></div>`;
    restoreFocusState(focusInfo);
    return;
  }
  if(!state.loggedIn){
    app.innerHTML = renderLogin();
    restoreFocusState(focusInfo);
    return;
  }
  if(!state.pet){
    app.innerHTML = renderPetSetup();
    restoreFocusState(focusInfo);
    return;
  }

  let body = "";
  if(state.tab === "home") body = renderHome();
  else if(state.tab === "history") body = renderHistory();
  else if(state.tab === "weight") body = renderWeight();
  else if(state.tab === "settings") body = renderSettings();

  app.innerHTML = `
    ${renderTopBar()}
    <div style="padding:6px 14px 90px;">${body}</div>
    <div class="tabbar">
      ${TABS.map(t=>`
        <button class="tabbtn ${state.tab===t.key?'active':''}" onclick="switchTab('${t.key}')">
          <span style="font-size:19px;">${t.emoji}</span>
          <span style="font-size:10.5px;">${t.label}</span>
        </button>`).join("")}
    </div>
    ${renderModal()}
    ${state.toast ? `<div class="toast">${esc(state.toast.message)}${state.toast.undo ? `<button class="toast-undo" onclick="runToastUndo()">取り消す</button>` : ""}</div>` : ""}
  `;
  restoreFocusState(focusInfo);
  if(state.tab === "weight") setTimeout(drawWeightChart, 30);
}

/* ================= WEIGHT ================= */
function renderWeight(){
  const log = state.weightPoints;
  const latest = log && log.length ? log[log.length-1] : null;
  const prev = log && log.length>1 ? log[log.length-2] : null;
  let monthAgo = null;
  if(log && log.length>1 && latest){
    const target = new Date(latest.datetime); target.setDate(target.getDate()-30);
    const candidates = log.filter(p => new Date(p.datetime) <= target);
    monthAgo = candidates.length ? candidates[candidates.length-1] : null;
  }
  const minVal = log && log.length ? Math.min(...log.map(p=>p.value)) : null;
  const maxVal = log && log.length ? Math.max(...log.map(p=>p.value)) : null;

  function diffBlock(from, isFirst){
    if(!from || !latest || from === latest) return "";
    const d = latest.value - from.value;
    const flat = Math.abs(d) < 0.005;
    const pct = from.value ? (d/from.value*100) : 0;
    const up = d > 0;
    const color = flat ? "var(--inkSoft)" : (up ? "var(--coral)" : "var(--mintText)");
    const arrow = flat ? "→" : (up ? "↑" : "↓");
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${isFirst?'':'border-top:1px solid var(--line);'}">
      <span style="font-size:13px;color:var(--inkSoft);">${fmtDateShort(from.datetime)}と比較</span>
      <span class="mono" style="font-size:14px;font-weight:600;color:${color};">${arrow} ${flat?'変化なし':`${Math.abs(d).toFixed(2)} kg（${Math.abs(pct).toFixed(1)}%）`}</span>
    </div>`;
  }

  return `
  <div class="card" style="padding:16px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:12px;color:var(--inkSoft);">最新の体重</div>
        <div class="mono" style="font-size:30px;font-weight:600;">${latest?`${latest.value} kg`:(log===null?"…":"—")}</div>
      </div>
      <button class="row-btn" onclick="openRecordModal('weight')">＋ 記録</button>
    </div>
    ${prev ? diffBlock(prev, true) : ""}
    ${monthAgo ? diffBlock(monthAgo, !prev) : ""}
  </div>

  ${minVal!==null ? `
  <div class="card" style="padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;">
    <div><div class="mono" style="font-size:17px;">${minVal} kg</div><div style="font-size:11px;color:var(--inkSoft);">最小</div></div>
    <div><div class="mono" style="font-size:17px;">${maxVal} kg</div><div style="font-size:11px;color:var(--inkSoft);">最大</div></div>
    <div><div class="mono" style="font-size:17px;">${log.length}</div><div style="font-size:11px;color:var(--inkSoft);">記録数</div></div>
  </div>` : ""}

  <div class="card" style="padding:16px 8px 8px;margin-bottom:16px;">
    ${log===null ? `<div style="text-align:center;padding:30px;"><span class="spin">⏳</span></div>` :
      log.length<2 ? `<div style="text-align:center;padding:24px 12px;color:var(--inkSoft);font-size:13px;">体重の記録が2件以上になるとグラフが表示されます。</div>` :
      `<canvas id="weight-canvas" height="220"></canvas>`
    }
  </div>

  ${log && log.length ? renderWeightList(log) : ""}`;
}
/* 体重画面の記録一覧（日付でグループ化し、タップで編集モーダルを開く） */
function renderWeightList(log){
  const grouped = {};
  log.forEach(r => {
    const day = r.datetime ? localDayStr(r.datetime) : "";
    if(!grouped[day]) grouped[day] = [];
    grouped[day].push(r);
  });
  const dayKeys = Object.keys(grouped).sort().reverse();
  return `
  <div style="font-weight:700;font-size:14px;margin-bottom:8px;">記録一覧</div>
  ${dayKeys.map(day => `
    <div style="margin-bottom:16px;">
      <div class="mono" style="font-size:12px;color:var(--inkSoft);margin-bottom:6px;">${fmtDateHeading(day)}</div>
      <div class="card" style="overflow:hidden;">
        ${grouped[day].slice().reverse().map((r,i)=> renderRecordRow(r, {divider:i>0})).join("")}
      </div>
    </div>`).join("")}
  <div style="font-size:11.5px;color:var(--inkSoft);text-align:center;margin-top:2px;">記録をタップすると編集・削除できます</div>`;
}

render();
</script>
